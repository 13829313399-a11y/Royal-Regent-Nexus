<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B1c Typed Async Feedback 去敏验收</title>
    <style>
      html, body, #app { min-height: 100%; margin: 0; }
      body { background: #edf2f5; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .b1c-shell { margin: 28px auto; width: min(980px, calc(100% - 36px)); }
      .b1c-panel { padding: 22px; border: 1px solid #cbd7df; border-radius: 12px; background: white; box-shadow: 0 12px 32px rgba(32,54,72,.08); }
      .b1c-panel h1 { margin: 0; color: #243c50; font-size: 20px; }
      .b1c-panel > p { margin: 7px 0 18px; color: #6f8292; }
      .b1c-controls { display: flex; flex-wrap: wrap; gap: 8px; }
      .b1c-controls button { min-height: 34px; padding: 0 12px; border: 1px solid #bdcbd5; border-radius: 7px; background: white; color: #31485d; cursor: pointer; }
      .b1c-state { margin-top: 18px; padding: 12px; border: 1px solid #d8e2e8; border-radius: 8px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #f8fafb; }
      .b1c-state span { color: #708493; font-size: 11px; }
      .b1c-state strong { display: block; margin-top: 3px; color: #314b5d; }
      .b1c-note { margin-top: 14px; color: #748694; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./b1cFeedbackHarness.ts"></script>
  </body>
</html>
