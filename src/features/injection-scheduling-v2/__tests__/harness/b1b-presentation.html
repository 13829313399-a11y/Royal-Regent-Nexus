<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B1b 业务标签去敏验收</title>
    <style>
      html, body, #app { min-height: 100%; margin: 0; }
      body { background: #edf2f5; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .b1b-shell { margin: 18px auto; width: min(1280px, calc(100% - 32px)); }
      .b1b-heading { margin-bottom: 10px; display: flex; align-items: center; gap: 8px; color: #243c50; }
      .b1b-heading strong { margin-right: auto; }
      .b1b-heading button { padding: 7px 11px; border: 1px solid #bdcbd5; border-radius: 7px; background: white; color: #31485d; cursor: pointer; }
      .b1b-stage { overflow: visible; border: 1px solid #cbd7df; border-radius: 10px; box-shadow: 0 12px 32px rgba(32, 54, 72, .08); background: white; }
      .b1b-stage .scheduling-commandbar { border-radius: 10px 10px 0 0; }
      .b1b-workspace { padding: 12px; display: grid; gap: 12px; }
      .b1b-workspace-header { padding: 8px 10px; border: 1px solid #d7e1e7; border-radius: 8px; display: flex; align-items: center; gap: 8px; background: #f8fafb; }
      .b1b-workspace-header > strong { margin-right: auto; color: #314b5d; }
      .b1b-plan-chip { padding: 5px 8px; border: 1px solid #bdd7ce; border-radius: 999px; color: #08715e; background: #edf9f6; font-weight: 700; }
      .b1b-table { height: 46px; overflow: hidden; border: 1px solid #d7e1e7; border-radius: 8px; }
      .b1b-table table { width: 100%; border-collapse: collapse; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./b1bPresentationHarness.ts"></script>
  </body>
</html>
