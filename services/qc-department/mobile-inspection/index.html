<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f7f9fb">
<title>移动验货</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css?v=21">
<script defer src="qc-photo-shapes.js?v=3"></script>
<script defer src="remote.js?v=17"></script>
<script defer src="app.js?v=20"></script>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m5 9 7 7 7-7"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 4h18l-7 8v7l-4 2V12Z"/></symbol>
  <symbol id="i-product" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4v10l-9 4-9-4Zm0 0 9 4 9-4M12 11v10M7.5 5l9 4"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
  <symbol id="i-camera" viewBox="0 0 24 24"><path d="M5 6h3l2-3h4l2 3h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
  <symbol id="i-images" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m3 17 5-5 4 4 2-2 7 6"/><circle cx="15.5" cy="8.5" r="1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5m0 3v.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</svg>
<div id="app">
  <header class="web-header" aria-label="QC 验货工作台">
    <div class="web-brand"><img src="icon.svg" alt=""><div><strong>华兴品质管理</strong><span>现场验货</span></div></div>
    <span class="web-test">移动验货</span>
  </header>
  <section id="tasks" class="screen" aria-label="现场验货任务">
    <header class="search-header">
      <button id="list-filter" type="button" aria-haspopup="dialog" aria-controls="sheet"><svg aria-hidden="true"><use href="#i-filter"/></svg><span>筛选</span></button>
      <div class="filters" id="task-filters">
        <button id="day-filter" class="filter-trigger" type="button" aria-haspopup="dialog" aria-controls="sheet"><span>全部日期</span><svg aria-hidden="true"><use href="#i-down"/></svg></button>
        <span class="filter-divider" aria-hidden="true"></span>
        <button id="customer-filter" class="filter-trigger" type="button" aria-haspopup="dialog" aria-controls="sheet"><span>全部客户</span><svg aria-hidden="true"><use href="#i-down"/></svg></button>
        <select id="day" aria-label="计划验货日期" hidden><option value="">全部日期</option></select>
        <select id="customer" aria-label="客户" hidden><option value="">全部客户</option></select>
      </div>
      <div class="search"><svg aria-hidden="true"><use href="#i-search"/></svg><label class="sr" for="search">搜索验货任务</label><input type="search" id="search" placeholder="客户 / PO / 货号" autocomplete="off"><button id="clear-search" type="button" aria-label="清空搜索" hidden><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
      <div id="list-overview" role="group" aria-label="验货处理状态"><button type="button" data-progress="all" aria-pressed="true">全部 <span id="list-total">—</span></button><button type="button" data-progress="todo" aria-pressed="false">待验 <span id="list-todo">—</span></button><button type="button" data-progress="done" aria-pressed="false">已完成 <span id="list-done">—</span></button></div>
    </header>
    <div id="task-scroll" class="scroll task-scroll">
      <div id="list-notice" aria-live="polite"></div>
      <div id="snapshot-notice" aria-live="polite"></div>
      <div id="return-notice"></div>
      <p id="task-count" class="count" role="status"></p>
      <button id="sync-summary" type="button" class="sync-summary" hidden></button>
      <div id="task-list"><p class="empty">正在连接验货台…</p></div>
      <p class="sandbox-note">手机保存，联网同步</p>
    </div>
  </section>

  <section id="entry" class="screen" aria-label="单笔验货" hidden>
    <header class="entry-header">
      <div class="navbar"><button class="back" id="back" type="button"><svg aria-hidden="true"><use href="#i-back"/></svg>验货台</button><h1 id="entry-title">验货</h1></div>
      <div id="entry-status"><span class="save-state" id="save-state" data-tone="ok" role="status"></span></div>
      <div class="identity">
        <div id="who" class="who"></div>
        <p id="entry-product" class="entry-product"></p>
        <div class="id-row"><strong id="po"></strong><span id="sku"></span></div>
        <div class="id-extra"><span id="plan"></span><button id="info" type="button">订单资料 <svg aria-hidden="true"><use href="#i-next"/></svg></button></div>
      </div>
    </header>
    <div class="scroll entry-scroll" id="entry-scroll">
      <div id="entry-notice" class="entry-notice" aria-live="polite"></div>
      <div id="return-reason" class="notice warning" hidden><span>退回原因</span><span id="return-copy"></span></div>
      <div id="submitted-info" class="notice success" hidden></div>
      <div class="group" id="judgment-group">
        <div class="field-title" id="result-heading"><h2 id="result-label">验货结果</h2><span>可先保存，稍后补全</span></div>
        <div class="results" id="results" role="group" aria-labelledby="result-label">
          <button type="button" data-result="PASS" aria-pressed="false">PASS</button>
          <button type="button" data-result="FAIL" aria-pressed="false">FAIL</button>
          <button type="button" data-result="PENDING" aria-pressed="false">PENDING</button>
          <button type="button" data-result="LG" aria-pressed="false">LG</button>
        </div>
        <label class="inline-field"><span>抽查数量</span><input id="sample-quantity" type="number" inputmode="decimal" min="0" max="1000000000000" step="0.0001" placeholder="未填写"></label>
        <label class="inline-field"><span>检验人员</span><input id="inspector" aria-label="检验人员" type="text" maxlength="255" placeholder="填写姓名"></label>
      </div>
      <div class="group" id="record-group">
        <div class="phone-notes">
          <label>验货问题<textarea data-note="problem" maxlength="20000" rows="2" placeholder="填写验货问题"></textarea></label>
          <label>备注<textarea data-note="remark" maxlength="20000" rows="2" placeholder="填写备注"></textarea></label>
        </div>
        <button class="write-field" type="button" data-open-field="problem"><span class="field-name">验货问题</span><span class="field-preview" id="problem"></span><svg aria-hidden="true"><use href="#i-next"/></svg></button>
        <button class="write-field" type="button" data-open-field="remark"><span class="field-name">备注</span><span class="field-preview" id="remark"></span><svg aria-hidden="true"><use href="#i-next"/></svg></button>
      </div>
      <div class="group" id="photo-group">
        <section class="photos" id="photos" aria-label="验货照片">
          <div class="field-title"><h2>照片</h2><span id="photo-count" role="status"></span></div>
          <div id="photo-actions">
            <label class="secondary file-pick"><svg aria-hidden="true"><use href="#i-camera"/></svg>拍照<input id="camera" type="file" accept="image/*" capture="environment" aria-label="拍照"></label>
            <label class="secondary file-pick"><svg aria-hidden="true"><use href="#i-images"/></svg>选照片<input id="album" type="file" accept="image/*" multiple aria-label="选照片"></label>
          </div>
          <div id="photo-list"></div>
          <div id="photo-feedback" aria-live="polite"></div>
        </section>
      </div>
    </div>
    <div class="dock" id="dock">
      <button type="button" id="save-return" class="primary">保存</button>
    </div>
    <section class="composer" id="composer" aria-label="验货记录填写" hidden>
      <div class="composer-input">
        <div class="composer-label" id="field-heading"><label for="editor" id="editor-label">验货问题</label><span id="composer-order"></span></div>
        <textarea id="editor" maxlength="20000" rows="2" enterkeyhint="enter" placeholder="输入验货记录"></textarea>
        <p id="editor-feedback" role="status" hidden></p>
      </div>
      <div class="keyboard-bar" id="keyboard-bar" role="group" aria-label="切换填写栏">
        <button type="button" data-focus="problem" aria-pressed="false">问题</button>
        <button type="button" data-focus="remark" aria-pressed="false">备注</button>
        <button type="button" id="hide-keyboard">完成</button>
      </div>
    </section>
  </section>

  <section id="pending" class="screen" aria-label="待审核" hidden>
    <header class="navbar"><button class="back" id="pending-back" type="button"><svg aria-hidden="true"><use href="#i-back"/></svg>任务</button><h1>待审核</h1><span class="pending-badge">已提交</span></header>
    <div class="scroll task-scroll"><p class="notice info">请在电脑验货台完成提交审核。</p><div id="pending-list"></div></div>
  </section>

  <section id="web-idle" hidden aria-label="验货详情">
    <div><img src="icon.svg" alt=""><h2>选择一笔验货任务</h2><p>从左侧按日期、客户或货号找到任务。</p></div>
  </section>

  <dialog id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" type="button" class="icon-button" aria-label="关闭"><svg aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <div id="sheet-content"></div>
  </dialog>
</div>
</body>
</html>
