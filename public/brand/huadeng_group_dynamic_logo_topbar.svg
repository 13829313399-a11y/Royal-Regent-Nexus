<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 1086" role="img" aria-labelledby="hd-title hd-desc">
 <title id="hd-title">华登集团 · 翡翠流光翻转标识</title>
 <desc id="hd-desc">双 R 与华登集团、royal regent 文字绕同一竖直中轴翻转切换。十六秒无缝循环，正反面各有两次明亮而柔和的流光掠过。支持减少动态效果；所有文字为矢量轮廓。</desc>
