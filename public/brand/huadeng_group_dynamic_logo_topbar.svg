 <style>
  .hd-mark,.hd-wordmark{transform-box:view-box;transform-origin:724px 543px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .hd-mark{transform:perspective(2200px) rotateY(0deg);animation:hd-front-flip 16s cubic-bezier(.45,0,.55,1) infinite,hd-front-visible 16s steps(1,end) infinite}
  .hd-wordmark{opacity:0;transform:perspective(2200px) rotateY(-180deg);animation:hd-back-flip 16s cubic-bezier(.45,0,.55,1) infinite,hd-back-visible 16s steps(1,end) infinite}
  .hd-english{opacity:.8}
  .hd-sheen{opacity:0;animation:hd-sheen-pass 16s linear infinite}
  .hd-word-sheen{opacity:0;animation:hd-word-pass 16s linear infinite}
  .hd-ambient{opacity:.6;animation:hd-breathe 8s ease-in-out infinite}
  @keyframes hd-front-flip{0%,34%{transform:perspective(2200px) rotateY(0deg)}46%,84%{transform:perspective(2200px) rotateY(180deg)}96%,100%{transform:perspective(2200px) rotateY(360deg)}}
  @keyframes hd-back-flip{0%,34%{transform:perspective(2200px) rotateY(-180deg)}46%,84%{transform:perspective(2200px) rotateY(0deg)}96%,100%{transform:perspective(2200px) rotateY(180deg)}}
  /* SVG backface handling varies by browser: swap faces exactly at 90 degrees. */
  @keyframes hd-front-visible{0%,100%{opacity:1}40%{opacity:0}90%{opacity:1}}
  @keyframes hd-back-visible{0%,100%{opacity:0}40%{opacity:1}90%{opacity:0}}
  @keyframes hd-sheen-pass{0%,2%{opacity:0;transform:translateX(-620px)}4%,13%{opacity:1}15%{opacity:0;transform:translateX(1780px)}17%,18%{opacity:0;transform:translateX(-620px)}20%,29%{opacity:1}31%,100%{opacity:0;transform:translateX(1780px)}}
  @keyframes hd-word-pass{0%,50%{opacity:0;transform:translateX(-460px)}52%,62%{opacity:1}64%{opacity:0;transform:translateX(1580px)}66%,67%{opacity:0;transform:translateX(-460px)}69%,79%{opacity:1}81%,100%{opacity:0;transform:translateX(1580px)}}
  @keyframes hd-breathe{0%,100%{opacity:.50}50%{opacity:.92}}
  @media(prefers-reduced-motion:reduce){.hd-mark,.hd-wordmark,.hd-sheen,.hd-word-sheen,.hd-ambient{animation:none!important}.hd-mark{transform:none}.hd-wordmark{visibility:hidden}.hd-sheen,.hd-word-sheen{opacity:0}.hd-ambient{opacity:.6}}
 </style>
