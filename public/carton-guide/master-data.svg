<text x="40" y="53" font-size="27" fill="#134e4a" font-weight="700">01  基础资料：先准备好选择项</text><text x="40" y="82" font-size="17" fill="#475569" font-weight="400">基础设置与货号包装配合使用；每项资料按本厂实际情况维护</text>
<rect x="40" y="126" width="488" height="145" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="68" cy="156" r="17" fill="#0f766e"/><text x="62" y="162" font-size="18" fill="#ffffff" font-weight="700">1</text><text x="95" y="163" font-size="22" fill="#0f172a" font-weight="700">客户与日期 / 编号规则</text><text x="62" y="202" font-size="18" fill="#475569" font-weight="400">演示客户：启用</text><text x="62" y="232" font-size="18" fill="#475569" font-weight="400">合同、货号、客户 PO 格式分别核对</text><rect x="550" y="126" width="490" height="145" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="578" cy="156" r="17" fill="#0f766e"/><text x="572" y="162" font-size="18" fill="#ffffff" font-weight="700">2</text><text x="605" y="163" font-size="22" fill="#0f172a" font-weight="700">纸品与单位</text><text x="572" y="202" font-size="18" fill="#475569" font-weight="400">纸品类型：外箱 / 内箱 / 卡纸</text><text x="572" y="232" font-size="18" fill="#475569" font-weight="400">纸质、规格；尺寸 cm 与数量 箱 / 张 分开</text><rect x="40" y="288" width="488" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="68" cy="318" r="17" fill="#0f766e"/><text x="62" y="324" font-size="18" fill="#ffffff" font-weight="700">3</text><text x="95" y="325" font-size="22" fill="#0f172a" font-weight="700">仓库、仓位与车间</text><text x="62" y="364" font-size="18" fill="#475569" font-weight="400">演示 A 库 → A01、A02</text><text x="62" y="394" font-size="18" fill="#475569" font-weight="400">先建实际仓位，再准备领用车间</text><rect x="550" y="288" width="490" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="578" cy="318" r="17" fill="#0f766e"/><text x="572" y="324" font-size="18" fill="#ffffff" font-weight="700">4</text><text x="605" y="325" font-size="22" fill="#0f172a" font-weight="700">货号与包装</text><text x="572" y="364" font-size="18" fill="#475569" font-weight="400">演示货号 DEMO-001 · 外箱每箱 12 个</text><text x="572" y="394" font-size="18" fill="#475569" font-weight="400">不同包装单独保留，选用后核对订单</text>
