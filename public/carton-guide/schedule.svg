<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">05  排期核对：客户先选对，再看需处理事项</title><desc id="desc">订单管理 → 排期核对与交期提醒；排期导入不直接创建采购订单。操作示意，所有记录为演示数据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<rect width="1080" height="510" fill="#f1f5f9"/>
<rect x="16" y="16" width="1048" height="478" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="16" y="16" width="1048" height="86" rx="16" fill="#f0fdfa" stroke="#ccfbf1"/>
<text x="40" y="53" font-size="27" fill="#134e4a" font-weight="700">05  排期核对：客户先选对，再看需处理事项</text><text x="40" y="82" font-size="17" fill="#475569" font-weight="400">订单管理 → 排期核对与交期提醒；排期导入不直接创建采购订单</text>
<circle cx="52" cy="146" r="17" fill="#0f766e"/><text x="46" y="152" font-size="18" fill="#ffffff" font-weight="700">1</text><text x="80" y="153" font-size="21" fill="#0f172a" font-weight="700">排期客户：演示客户</text><path d="M400 146 L570 146" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="606" cy="146" r="17" fill="#0f766e"/><text x="600" y="152" font-size="18" fill="#ffffff" font-weight="700">2</text><rect x="640" y="125" width="250" height="42" rx="8" fill="#0f766e" stroke="#0f766e"/><text x="656" y="153" font-size="18" fill="#ffffff" font-weight="700">导入业务排期</text><rect x="40" y="184" width="1000" height="199" rx="12" fill="#ffffff" stroke="#cbd5e1"/><rect x="40" y="184" width="1000" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="60" y="211" font-size="17" fill="#64748b" font-weight="700">类型</text><text x="170" y="211" font-size="17" fill="#64748b" font-weight="700">合同 / 货号</text><text x="500" y="211" font-size="17" fill="#64748b" font-weight="700">源产品数量</text><text x="680" y="211" font-size="17" fill="#64748b" font-weight="700">下单状态</text><text x="846" y="211" font-size="17" fill="#64748b" font-weight="700">时限 / 处理</text><text x="60" y="266" font-size="19" fill="#0f172a" font-weight="400">正单</text><text x="170" y="266" font-size="18" fill="#0f172a" font-weight="400">DEMO-SC-001 / DEMO-001</text><text x="500" y="266" font-size="19" fill="#0f172a" font-weight="400">1,000 个</text><text x="680" y="266" font-size="19" fill="#b45309" font-weight="700">需下单</text><text x="846" y="266" font-size="18" fill="#b91c1c" font-weight="700">今天必须下单</text><text x="60" y="323" font-size="19" fill="#0f172a" font-weight="400">加单</text><text x="170" y="323" font-size="18" fill="#0f172a" font-weight="400">DEMO-SC-002 / DEMO-002</text><text x="500" y="323" font-size="19" fill="#0f172a" font-weight="400">数量有变化</text><text x="680" y="323" font-size="19" fill="#0f766e" font-weight="700">原单核实</text><text x="846" y="323" font-size="18" fill="#0f172a" font-weight="400">核对追加需求</text><circle cx="52" cy="420" r="17" fill="#0f766e"/><text x="46" y="426" font-size="18" fill="#ffffff" font-weight="700">3</text><text x="80" y="428" font-size="20" fill="#134e4a" font-weight="700">核对原始合同、货号、数量、装箱及完整日期，再转入正常下单。</text>
<text x="40" y="482" font-size="15" fill="#64748b" font-weight="400">纸箱模块使用教程 · 操作示意 / 演示数据</text>
