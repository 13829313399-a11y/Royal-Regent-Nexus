<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="535" viewBox="0 0 1080 535" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">06  一次确认多张订单，生成合并采购单</title><desc id="desc">同厂区、同供应商，本次新确认两张及以上；原订单明细分别保留。操作示意，所有记录为演示数据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<rect width="1080" height="535" fill="#f1f5f9"/>
<rect x="16" y="16" width="1048" height="503" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="16" y="16" width="1048" height="86" rx="16" fill="#f0fdfa" stroke="#ccfbf1"/>
<text x="40" y="53" font-size="27" fill="#134e4a" font-weight="700">06  一次确认多张订单，生成合并采购单</text><text x="40" y="82" font-size="17" fill="#475569" font-weight="400">同厂区、同供应商，本次新确认两张及以上；原订单明细分别保留</text>
<rect x="40" y="126" width="428" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="68" cy="156" r="17" fill="#0f766e"/><text x="62" y="162" font-size="18" fill="#ffffff" font-weight="700">1</text><text x="95" y="163" font-size="22" fill="#0f172a" font-weight="700">订单台账：勾选待下单</text><text x="62" y="202" font-size="18" fill="#475569" font-weight="400">☑ DEMO-SC-001 · DEMO-001</text><text x="62" y="232" font-size="18" fill="#475569" font-weight="400">☑ DEMO-SC-002 · DEMO-002</text><rect x="62" y="284" width="382" height="42" rx="8" fill="#0f766e" stroke="#0f766e"/><text x="78" y="312" font-size="18" fill="#ffffff" font-weight="700">确认订单并锁定（2）</text><path d="M480 242 L584 242" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="605" y="126" width="435" height="270" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="626" y="161" font-size="23" fill="#134e4a" font-weight="700">合并采购单 CG-演示</text><text x="626" y="198" font-size="17" fill="#475569" font-weight="400">原采购单号 / 合同 / 货号 / PO 均保留</text><rect x="625" y="218" width="395" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="640" y="255" font-size="17" fill="#0f172a" font-weight="400">原单 1：外箱 84 箱 · 卡纸 1,000 张</text><rect x="625" y="292" width="395" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="640" y="329" font-size="18" fill="#0f172a" font-weight="400">原单 2：外箱 50 箱</text><text x="60" y="430" font-size="20" fill="#0f766e" font-weight="700">自动发行到供应商协同，并下载合并文件。再次下载仍是原批次。</text><text x="60" y="465" font-size="18" fill="#475569" font-weight="400">采购由仓库确认锁定生成；供应商接单是之后的动作。</text>
<text x="40" y="507" font-size="15" fill="#64748b" font-weight="400">纸箱模块使用教程 · 操作示意 / 演示数据</text>
</g></svg>