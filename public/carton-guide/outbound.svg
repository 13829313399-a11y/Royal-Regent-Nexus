<text x="40" y="53" font-size="27" fill="#134e4a" font-weight="700">09  出库按实物发生登记</text><text x="40" y="82" font-size="17" fill="#475569" font-weight="400">库存管理 → 实时库存；数量、来源单据、车间和用途同时核对</text>
<rect x="40" y="132" width="276" height="253" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="68" cy="162" r="17" fill="#0f766e"/><text x="62" y="168" font-size="18" fill="#ffffff" font-weight="700">1</text><text x="95" y="169" font-size="22" fill="#0f172a" font-weight="700">当前仓位结存</text><text x="62" y="208" font-size="18" fill="#475569" font-weight="400">演示货号 DEMO-001</text><text x="62" y="238" font-size="18" fill="#475569" font-weight="400">A 库 / A01：95 箱</text><text x="62" y="268" font-size="18" fill="#475569" font-weight="400">找到实际出货仓位</text><path d="M328 259 L364 259" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="379" y="132" width="378" height="253" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="407" cy="162" r="17" fill="#0f766e"/><text x="401" y="168" font-size="18" fill="#ffffff" font-weight="700">2</text><text x="434" y="169" font-size="22" fill="#0f172a" font-weight="700">登记本次出库</text><text x="401" y="208" font-size="18" fill="#475569" font-weight="400">实际数量：30 箱</text><text x="401" y="238" font-size="18" fill="#475569" font-weight="400">来源：LY-演示</text><text x="401" y="268" font-size="18" fill="#475569" font-weight="400">用途：正常领用／发货</text><text x="401" y="298" font-size="18" fill="#475569" font-weight="400">车间：演示组装车间</text><path d="M769 259 L805 259" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="820" y="132" width="220" height="253" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="848" cy="162" r="17" fill="#0f766e"/><text x="842" y="168" font-size="18" fill="#ffffff" font-weight="700">3</text><text x="875" y="169" font-size="22" fill="#0f172a" font-weight="700">确认后</text><text x="842" y="208" font-size="18" fill="#475569" font-weight="400">当前结存：65 箱</text><text x="842" y="238" font-size="18" fill="#475569" font-weight="400">保留出库流水</text><text x="842" y="268" font-size="18" fill="#475569" font-weight="400">原用途可追溯</text><text x="40" y="434" font-size="20" fill="#134e4a" font-weight="700">调仓使用“调仓”；退供应商、报损和借出分别选择对应用途。</text>
