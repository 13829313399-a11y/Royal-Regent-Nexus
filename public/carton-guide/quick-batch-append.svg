<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">多选订单，一次追加</title><desc id="desc">勾选需要追加的订单，点击“批量追加”。正单、样板和杂单都可按当前状态选择。；逐单填写“本次追加”和原因，核对“追加后总需求”。例如原 100、本次加 20，结果是 120。；检查每张单后“确认批量追加”。回原订单看新总量和版本；已发给供应商的单要重新核对。</desc>
  <rect width="1080" height="470" rx="20" fill="#f1f5f9"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="28" y="43" font-size="27" font-weight="700" fill="#0f172a">多选订单，一次追加</text>
    <text x="28" y="74" font-size="17" fill="#64748b">操作示意 · 按 1 → 2 → 3 办理，具体按钮以当前页面为准</text>
    <rect x="28" y="100" width="1024" height="266" rx="16" fill="white" stroke="#cbd5e1"/><text x="52" y="136" font-size="23" fill="#0f766e">① 勾选原订单     →     ② 填本次追加     →     ③ 核对后确认</text><path d="M52 193 H1028 M52 252 H1028 M52 310 H1028" stroke="#e2e8f0"/><text x="52" y="180" font-size="19" fill="#334155">原订单（示例）</text><text x="302" y="180" font-size="19" fill="#334155">当前需求</text><text x="552" y="180" font-size="19" fill="#334155">本次追加</text><text x="802" y="180" font-size="19" fill="#334155">追加后总需求</text><text x="52" y="232" font-size="24" fill="#334155">A 单 · 外箱</text><text x="302" y="232" font-size="24" fill="#334155">100 个</text><text x="552" y="232" font-size="24" fill="#334155">+ 20 个</text><text x="802" y="232" font-size="24" fill="#0f766e">120 个</text><text x="52" y="289" font-size="24" fill="#334155">B 单 · 卡纸</text><text x="302" y="289" font-size="24" fill="#334155">200 张</text><text x="552" y="289" font-size="24" fill="#334155">+ 30 张</text><text x="802" y="289" font-size="24" fill="#0f766e">230 张</text><text x="52" y="344" font-size="20" fill="#334155">两张单各自追加，不合单。已收数量不变；已发订单需供应商核对新版本。</text><rect x="28" y="382" width="1024" height="70" rx="12" fill="#ccfbf1"/><text x="48" y="408" font-size="20" fill="#115e59"><tspan x="48" dy="0">每张原单分别增加需求，原单号、已收数量和历史记录保留。</tspan></text>
  </g></svg>
