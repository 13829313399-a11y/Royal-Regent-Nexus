<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="545" viewBox="0 0 1080 545" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">纸箱工作从这里开始</title><desc id="desc">先初始化资料与结余；日常按真实业务发生顺序处理。操作示意，所有记录为演示数据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<rect width="1080" height="545" fill="#f1f5f9"/>
<rect x="16" y="16" width="1048" height="513" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="16" y="16" width="1048" height="86" rx="16" fill="#f0fdfa" stroke="#ccfbf1"/>
<text x="40" y="53" font-size="27" fill="#134e4a" font-weight="700">纸箱工作从这里开始</text><text x="40" y="82" font-size="17" fill="#475569" font-weight="400">先初始化资料与结余；日常按真实业务发生顺序处理</text>
<text x="40" y="140" font-size="20" fill="#0f766e" font-weight="700">首次启用</text><rect x="40" y="154" width="300" height="124" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="68" cy="184" r="17" fill="#0f766e"/><text x="62" y="190" font-size="18" fill="#ffffff" font-weight="700">1</text><text x="95" y="191" font-size="22" fill="#0f172a" font-weight="700">基础资料</text><text x="62" y="230" font-size="18" fill="#475569" font-weight="400">客户 · 纸品 · 包装 · 仓位</text><path d="M350 215 L380 215" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="390" y="154" width="300" height="124" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="418" cy="184" r="17" fill="#0f766e"/><text x="412" y="190" font-size="18" fill="#ffffff" font-weight="700">2</text><text x="445" y="191" font-size="22" fill="#0f172a" font-weight="700">期初库存</text><text x="412" y="230" font-size="18" fill="#475569" font-weight="400">实际结余 · 先预览再入账</text><path d="M700 215 L730 215" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="740" y="154" width="300" height="124" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="768" cy="184" r="17" fill="#0f766e"/><text x="762" y="190" font-size="18" fill="#ffffff" font-weight="700">3</text><text x="795" y="191" font-size="22" fill="#0f172a" font-weight="700">历史订单（可选）</text><text x="762" y="230" font-size="18" fill="#475569" font-weight="400">已外部下单 · 需要继续跟到货</text><text x="40" y="322" font-size="20" fill="#0f766e" font-weight="700">每天从看板开始，有实际业务再处理相应步骤</text><rect x="40" y="342" width="152" height="86" rx="12" fill="#f0fdfa" stroke="#99f6e4"/><text x="56" y="373" font-size="19" fill="#134e4a" font-weight="700">工作看板</text><text x="56" y="403" font-size="16" fill="#475569" font-weight="400">先看今日待办</text><rect x="212" y="342" width="152" height="86" rx="12" fill="#f0fdfa" stroke="#99f6e4"/><text x="228" y="373" font-size="19" fill="#134e4a" font-weight="700">排期核对</text><text x="228" y="403" font-size="16" fill="#475569" font-weight="400">识别漏单与变化</text><rect x="384" y="342" width="152" height="86" rx="12" fill="#f0fdfa" stroke="#99f6e4"/><text x="400" y="373" font-size="19" fill="#134e4a" font-weight="700">仓库落单</text><text x="400" y="403" font-size="16" fill="#475569" font-weight="400">确认锁定采购</text><rect x="556" y="342" width="152" height="86" rx="12" fill="#f0fdfa" stroke="#99f6e4"/><text x="572" y="373" font-size="19" fill="#134e4a" font-weight="700">供应商</text><text x="572" y="403" font-size="16" fill="#475569" font-weight="400">接单及登记送货</text><rect x="728" y="342" width="152" height="86" rx="12" fill="#f0fdfa" stroke="#99f6e4"/><text x="744" y="373" font-size="19" fill="#134e4a" font-weight="700">验收入库</text><text x="744" y="403" font-size="16" fill="#475569" font-weight="400">按有效实收入库</text><rect x="900" y="342" width="152" height="86" rx="12" fill="#f0fdfa" stroke="#99f6e4"/><text x="916" y="373" font-size="19" fill="#134e4a" font-weight="700">领料 / 出库</text><text x="916" y="403" font-size="16" fill="#475569" font-weight="400">按实物登记去向</text><path d="M198 385 L207 385" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M370 385 L379 385" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M542 385 L551 385" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M714 385 L723 385" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M886 385 L895 385" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="40" y="470" font-size="18" fill="#475569" font-weight="400">有变化回原业务更正；月底分别核对供应商账单与库存结余。</text>
<text x="40" y="517" font-size="15" fill="#64748b" font-weight="400">纸箱模块使用教程 · 操作示意 / 演示数据</text>
</g></svg>