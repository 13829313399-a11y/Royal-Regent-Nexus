<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="510" viewBox="0 0 1080 510" role="img" aria-labelledby="title desc" lang="zh-CN">
<title id="title">08  仓库验收后，按有效实收入库</title><desc id="desc">送货登记 → 实物验收 → 确认数量、单价、日期及分仓 → 入库。操作示意，所有记录为演示数据。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker></defs>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<rect width="1080" height="510" fill="#f1f5f9"/>
<rect x="16" y="16" width="1048" height="478" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
<rect x="16" y="16" width="1048" height="86" rx="16" fill="#f0fdfa" stroke="#ccfbf1"/>
<text x="40" y="53" font-size="27" fill="#134e4a" font-weight="700">08  仓库验收后，按有效实收入库</text><text x="40" y="82" font-size="17" fill="#475569" font-weight="400">送货登记 → 实物验收 → 确认数量、单价、日期及分仓 → 入库</text>
<rect x="40" y="126" width="260" height="255" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="68" cy="156" r="17" fill="#0f766e"/><text x="62" y="162" font-size="18" fill="#ffffff" font-weight="700">1</text><text x="95" y="163" font-size="22" fill="#0f172a" font-weight="700">供应商登记送货</text><text x="62" y="202" font-size="18" fill="#475569" font-weight="400">原送货单号：DN-演示</text><text x="62" y="232" font-size="18" fill="#475569" font-weight="400">纸面送货：100 箱</text><text x="62" y="262" font-size="18" fill="#475569" font-weight="400">目的厂区与纸品明确</text><text x="62" y="292" font-size="18" fill="#475569" font-weight="400">此时库存尚未增加</text><path d="M312 249 L348 249" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="363" y="126" width="365" height="255" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="391" cy="156" r="17" fill="#0f766e"/><text x="385" y="162" font-size="18" fill="#ffffff" font-weight="700">2</text><text x="418" y="163" font-size="22" fill="#0f172a" font-weight="700">仓库实际核实</text><text x="385" y="202" font-size="18" fill="#475569" font-weight="400">实收 100 · 损坏 3 · 拒收 2</text><text x="385" y="232" font-size="18" fill="#475569" font-weight="400">有效数量：95 箱</text><text x="385" y="262" font-size="18" fill="#475569" font-weight="400">A01：60 箱 / A02：35 箱</text><text x="385" y="292" font-size="18" fill="#475569" font-weight="400">确认单价及实际验收日期</text><path d="M740 249 L776 249" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="790" y="126" width="250" height="255" rx="12" fill="#ffffff" stroke="#cbd5e1"/><circle cx="818" cy="156" r="17" fill="#0f766e"/><text x="812" y="162" font-size="18" fill="#ffffff" font-weight="700">3</text><text x="845" y="163" font-size="22" fill="#0f172a" font-weight="700">确认入库</text><text x="812" y="202" font-size="18" fill="#475569" font-weight="400">实时库存：+95 箱</text><text x="812" y="232" font-size="18" fill="#475569" font-weight="400">生成入库流水</text><text x="812" y="262" font-size="18" fill="#475569" font-weight="400">原单余量继续待收</text><text x="812" y="292" font-size="18" fill="#475569" font-weight="400">按验收日期归月</text><rect x="40" y="405" width="1000" height="58" rx="8" fill="#f0fdfa" stroke="#99f6e4"/><text x="61" y="441" font-size="19" fill="#134e4a" font-weight="700">有效入库＝实收－损坏－拒收－其他不可用；分仓合计必须等于有效数量。</text>
<text x="40" y="482" font-size="15" fill="#64748b" font-weight="400">纸箱模块使用教程 · 操作示意 / 演示数据</text>
</g></svg>