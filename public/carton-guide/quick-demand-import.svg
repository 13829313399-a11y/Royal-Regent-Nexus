<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">Excel 批量新建样板／杂单</title><desc id="desc">选择自有 Excel 或参考模板，核对列匹配、按整单预览并补齐资料，再导入完整订单。</desc>
  <rect width="1080" height="470" rx="20" fill="#f1f5f9"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="28" y="43" font-size="27" font-weight="700" fill="#0f172a">Excel 批量新建样板／杂单</text>
    <text x="28" y="74" font-size="17" fill="#64748b">操作示意 · 按 1 → 2 → 3 办理，具体按钮以当前页面为准</text>
    <rect x="28" y="100" width="1024" height="266" rx="16" fill="white" stroke="#cbd5e1"/><text x="52" y="136" font-size="23" fill="#0f766e">① 自有表／模板    →    ② 匹配列名、整单核对    →    ③ 导入完整订单</text><rect x="52" y="158" width="570" height="154" rx="8" fill="#f8fafc"/><path d="M52 194 H622 M52 233 H622 M52 272 H622" stroke="#cbd5e1"/><text x="68" y="184" font-size="18" fill="#334155">分组编号</text><text x="205" y="184" font-size="18" fill="#334155">订单类型</text><text x="342" y="184" font-size="18" fill="#334155">纸品</text><text x="479" y="184" font-size="18" fill="#334155">数量</text><text x="68" y="221" font-size="20" fill="#334155">A</text><text x="205" y="221" font-size="20" fill="#334155">样板单</text><text x="342" y="221" font-size="20" fill="#334155">外箱</text><text x="479" y="221" font-size="20" fill="#334155">20 个</text><text x="68" y="260" font-size="20" fill="#334155">A</text><text x="205" y="260" font-size="20" fill="#334155">样板单</text><text x="342" y="260" font-size="20" fill="#334155">卡纸</text><text x="479" y="260" font-size="20" fill="#334155">20 张</text><text x="68" y="299" font-size="20" fill="#334155">B</text><text x="205" y="299" font-size="20" fill="#334155">杂单</text><text x="342" y="299" font-size="20" fill="#334155">内箱</text><text x="479" y="299" font-size="20" fill="#334155">50 个</text><text x="646" y="240" font-size="28" fill="#0f766e">→</text><rect x="697" y="169" width="325" height="59" rx="10" fill="#ccfbf1"/><rect x="697" y="245" width="325" height="59" rx="10" fill="#e0f2fe"/><text x="714" y="205" font-size="22" fill="#115e59">A：1 张样板单，2 项纸品</text><text x="714" y="281" font-size="22" fill="#075985">B：1 张杂单，1 项纸品</text><text x="52" y="344" font-size="20" fill="#334155">分组示例；规格、单位和日期也需填写。生成草稿后，再核对并发给供应商。</text><rect x="28" y="382" width="1024" height="70" rx="12" fill="#ccfbf1"/><text x="48" y="408" font-size="20" fill="#115e59"><tspan x="48" dy="0">例如 A 组两行纸品生成一张订单；B 组另生成一张。</tspan></text>
  </g></svg>
