<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">月底看金额，先处理差异</title><desc id="desc">进入“月结对账 → 本月对账”，选择厂区、月份和币种。；先看已验收送货、退货贷项和本月应结；有待处理项就打开原单核实数量、价格或退货依据。；处理后刷新再核对。付款看“应付与付款”，库存结余另看“库存月结记录”。</desc>
  <rect width="1080" height="470" rx="20" fill="#f1f5f9"/>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="28" y="43" font-size="27" font-weight="700" fill="#0f172a">月底看金额，先处理差异</text>
    <text x="28" y="74" font-size="17" fill="#64748b">操作示意 · 按 1 → 2 → 3 办理，具体按钮以当前页面为准</text>
    <rect x="28" y="100" width="1024" height="266" rx="16" fill="white" stroke="#cbd5e1"/><text x="52" y="136" font-size="22" fill="#0f766e">① 选厂区 / 月份 / 币种   →   ② 看金额和明细   →   ③ 差异回原单处理</text><rect x="52" y="166" width="296" height="126" rx="12" fill="#f1f5f9"/><text x="76" y="205" font-size="20" fill="#334155">已验收送货</text><text x="76" y="254" font-size="34" fill="#0f172a">10,000 元</text><rect x="392" y="166" width="296" height="126" rx="12" fill="#f1f5f9"/><text x="416" y="205" font-size="20" fill="#334155">退货贷项</text><text x="416" y="254" font-size="34" fill="#0f172a">1,000 元</text><rect x="732" y="166" width="296" height="126" rx="12" fill="#ccfbf1"/><text x="756" y="205" font-size="20" fill="#334155">本月应结</text><text x="756" y="254" font-size="34" fill="#0f766e">9,000 元</text><text x="355" y="240" font-size="32" fill="#0f766e">−</text><text x="694" y="240" font-size="29" fill="#0f766e">＝</text><text x="52" y="344" font-size="20" fill="#334155">金额为示例。本页只读，无需系统内确认；付款、收款和库存月结另办。</text><rect x="28" y="382" width="1024" height="70" rx="12" fill="#ccfbf1"/><text x="48" y="408" font-size="20" fill="#115e59"><tspan x="48" dy="0">本月应结＝已验收送货金额－退货贷项；无差异后按现有流程对账。</tspan></text>
  </g></svg>
