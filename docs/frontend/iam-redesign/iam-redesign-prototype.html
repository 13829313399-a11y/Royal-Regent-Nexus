<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Royal Regent Nexus · 权限与组织 IAM 2.0 交互原型</title>
<style>
  :root {
    --bg: #f2f7f8;
    --surface: #ffffff;
    --surface-subtle: #f7fafb;
    --surface-hover: #edf6f4;
    --ink: #0f1f28;
    --ink-2: #3b4f5a;
    --muted: #647883;
    --border: #dbe6e9;
    --border-strong: #c2d4d9;

    --jade-deep: #053e39;
    --jade-mid: #08554e;
    --primary: #006559;
    --primary-hover: #005349;
    --primary-soft: #e3f4f0;
    --primary-ink: #00453d;

    --emerald: #0f7a58;
    --emerald-bg: #e5f6ef;
    --amber: #9b5c0f;
    --amber-bg: #fff5e3;
    --amber-border: #f2d5a0;
    --red: #c4212e;
    --red-bg: #fef0f1;
    --red-border: #f5c2c7;
    --blue: #1c5da6;
    --blue-bg: #eaf3ff;
    --violet: #62469a;
    --violet-bg: #f2eefc;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(10, 35, 40, .04);
    --shadow-md: 0 8px 24px rgba(10, 35, 40, .08);
    --shadow-drawer: -12px 0 40px rgba(8, 30, 34, .16);
    --ease: cubic-bezier(.16, 1, .3, 1);
    --font: "Microsoft YaHei", "PingFang SC", "Segoe UI", -apple-system, sans-serif;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font); font-size: 13.5px; line-height: 1.5;
    color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; }
  button:disabled { cursor: not-allowed; opacity: .5; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-size: 12px; }

  /* ── Top Shell ── */
  .app-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar {
    height: 60px; flex-shrink: 0;
    background: linear-gradient(108deg, var(--jade-deep), var(--jade-mid));
    color: #fff; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    border-bottom: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 2px 10px rgba(5, 46, 42, .16);
    z-index: 30;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .back-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: rgba(255,255,255,.78); font-size: 12.5px; padding: 6px 10px;
    border-radius: 8px; transition: background 140ms, color 140ms;
  }
  .back-link:hover { background: rgba(255,255,255,.1); color: #fff; }
  .brand-divider { width: 1px; height: 22px; background: rgba(255,255,255,.18); }
  .brand-title {
    display: flex; align-items: center; gap: 9px;
    font-size: 16.5px; font-weight: 700; letter-spacing: .01em; white-space: nowrap;
  }
  .brand-badge {
    font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
    padding: 2px 7px; border-radius: 99px;
    background: rgba(122, 240, 224, .18); color: #b7fff5;
    border: 1px solid rgba(153, 255, 240, .28);
  }
  .main-nav { display: flex; align-items: center; gap: 4px; height: 100%; }
  .nav-tab {
    position: relative; height: 40px; padding: 0 15px; border-radius: 9px;
    color: rgba(230, 248, 245, .82); font-size: 13.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 7px;
    transition: background 150ms, color 150ms;
  }
  .nav-tab:hover { background: rgba(255,255,255,.09); color: #fff; }
  .nav-tab.active {
    color: #fff; font-weight: 600;
    background: rgba(82, 212, 197, .22);
    box-shadow: inset 0 0 0 1px rgba(173, 255, 243, .26);
  }
  .nav-pill {
    min-width: 20px; height: 18px; padding: 0 6px; border-radius: 99px;
    font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
    background: #f5b942; color: #3d2400;
  }
  .topbar-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .perspective-switch {
    display: inline-flex; padding: 3px; border-radius: 9px;
    background: rgba(0,0,0,.24); border: 1px solid rgba(255,255,255,.14);
  }
  .perspective-switch button {
    padding: 5px 11px; border-radius: 6px; font-size: 12px; color: rgba(255,255,255,.78);
    transition: all 140ms;
  }
  .perspective-switch button.active {
    background: #fff; color: var(--jade-deep); font-weight: 600;
    box-shadow: 0 1px 3px rgba(0,0,0,.18);
  }
  .user-chip {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 5px;
    border-radius: 99px; background: rgba(255,255,255,.1); font-size: 12.5px;
  }
  .user-chip .avatar-sm {
    width: 26px; height: 26px; border-radius: 50%; background: #8be5d8; color: var(--jade-deep);
    font-weight: 700; font-size: 12px; display: grid; place-items: center;
  }

  /* ── Main Viewport ── */
  .main-stage { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .view-container {
    flex: 1; min-height: 0; padding: 16px 20px;
    display: flex; flex-direction: column; gap: 14px; overflow: hidden;
  }
  .view-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 20px; }

  /* ── Buttons & Inputs ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    transition: all 140ms var(--ease); white-space: nowrap;
  }
  .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-outline { background: #fff; color: var(--ink-2); border: 1px solid var(--border-strong); }
  .btn-outline:hover:not(:disabled) { background: var(--surface-subtle); border-color: var(--primary); color: var(--primary); }
  .btn-soft { background: var(--primary-soft); color: var(--primary-ink); }
  .btn-soft:hover:not(:disabled) { background: #d0ece6; }
  .btn-danger-outline { background: #fff; color: var(--red); border: 1px solid var(--red-border); }
  .btn-danger-outline:hover:not(:disabled) { background: var(--red-bg); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover:not(:disabled) { background: #a81824; }
  .btn-ghost { color: var(--muted); }
  .btn-ghost:hover:not(:disabled) { background: var(--surface-subtle); color: var(--ink); }

  .input, .select, .textarea {
    height: 34px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--border-strong); background: #fff;
    font-size: 13px; color: var(--ink); outline: none;
    transition: border-color 140ms, box-shadow 140ms;
  }
  .textarea { height: auto; padding: 8px 10px; resize: vertical; }
  .input:focus, .select:focus, .textarea:focus {
    border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0, 101, 89, .14);
  }
  .search-box {
    position: relative; display: flex; align-items: center;
  }
  .search-box svg { position: absolute; left: 10px; color: var(--muted); pointer-events: none; }
  .search-box .input { padding-left: 32px; width: 100%; }

  /* ── Badges / Pills ── */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    height: 22px; padding: 0 8px; border-radius: 6px;
    font-size: 11.5px; font-weight: 600; white-space: nowrap;
  }
  .pill-dot::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  }
  .pill-emerald { background: var(--emerald-bg); color: var(--emerald); }
  .pill-amber { background: var(--amber-bg); color: var(--amber); }
  .pill-red { background: var(--red-bg); color: var(--red); }
  .pill-blue { background: var(--blue-bg); color: var(--blue); }
  .pill-violet { background: var(--violet-bg); color: var(--violet); }
  .pill-slate { background: #eef3f5; color: #516570; }
  .pill-primary { background: var(--primary-soft); color: var(--primary-ink); }

  .pkg-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
    background: #eef7f5; color: #0c544b; border: 1px solid #cde5df;
  }
  .pkg-chip.secondary { background: #f3effc; color: #583c91; border-color: #dfd5f6; }
  .pkg-chip.warn { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-border); }
  .pkg-chip.outdated::after {
    content: "可升级"; font-size: 10px; padding: 0 4px; border-radius: 4px;
    background: var(--blue); color: #fff; margin-left: 2px;
  }
  .factory-chip {
    display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 5px;
    font-size: 11.5px; background: #f1f5f7; color: var(--ink-2); border: 1px solid #e1eaed;
  }
  .factory-chip.all { background: #e8f3ff; color: var(--blue); border-color: #c8dffa; font-weight: 600; }

  /* ── VIEW 1: INBOX (办理大厅) ── */
  .track-bar {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; flex-shrink: 0;
  }
  .track-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
    text-align: left; transition: all 160ms var(--ease); box-shadow: var(--shadow-sm);
    position: relative; overflow: hidden;
  }
  .track-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--track-color, var(--primary));
  }
  .track-card:hover { transform: translateY(-1px); border-color: var(--border-strong); box-shadow: var(--shadow-md); }
  .track-card.active {
    background: var(--track-soft, var(--primary-soft));
    border-color: var(--track-color, var(--primary));
    box-shadow: 0 0 0 1px var(--track-color, var(--primary));
  }
  .track-meta { display: flex; flex-direction: column; gap: 2px; }
  .track-title { font-size: 13.5px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 6px; }
  .track-sub { font-size: 11.5px; color: var(--muted); }
  .track-count {
    font-size: 26px; font-weight: 700; color: var(--track-color, var(--primary));
    line-height: 1; padding-left: 12px;
  }

  .inbox-grid {
    flex: 1; min-height: 0; display: grid; grid-template-columns: 330px minmax(0, 1fr);
    gap: 14px; overflow: hidden;
  }
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .panel-header {
    padding: 12px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface); flex-shrink: 0;
  }
  .panel-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .queue-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .queue-item {
    width: 100%; text-align: left; padding: 11px 12px; border-radius: 10px;
    border: 1px solid transparent; background: #fff;
    display: flex; flex-direction: column; gap: 6px;
    transition: all 140ms;
  }
  .queue-item:hover { background: var(--surface-subtle); border-color: var(--border); }
  .queue-item.active {
    background: var(--primary-soft); border-color: #9ed4ca;
    box-shadow: inset 3px 0 0 var(--primary);
  }
  .queue-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .queue-name { font-weight: 700; font-size: 13.5px; color: var(--ink); display: flex; align-items: center; gap: 7px; }
  .queue-change { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
  .queue-foot { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--muted); }

  /* Dual-engine review workspace */
  .review-shell { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .review-top-banner {
    padding: 14px 18px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #fafdfe, #fff);
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0;
  }
  .review-dual {
    flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, .85fr);
    overflow: hidden;
  }
  .review-left { overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; border-right: 1px solid var(--border); }
  .review-right { overflow-y: auto; padding: 16px; background: #f8fbfc; display: flex; flex-direction: column; gap: 12px; }
  .review-footer {
    padding: 12px 18px; border-top: 1px solid var(--border); background: #fff;
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-shrink: 0;
  }

  .compare-strip {
    display: grid; grid-template-columns: 1fr 28px 1fr; align-items: center; gap: 10px;
    padding: 12px; border-radius: 11px; background: var(--surface-subtle); border: 1px solid var(--border);
  }
  .compare-box { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .compare-box.after { border-color: #9ad5ca; background: #f3fbf9; }
  .compare-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .compare-main { font-size: 14px; font-weight: 700; color: var(--ink); }
  .compare-sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

  .info-grid-4 {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px;
    padding: 12px; border-radius: 10px; background: #f5f9ff; border: 1px solid #d4e5fb;
  }
  .info-cell label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .info-cell strong { font-size: 13px; color: var(--ink); }

  .section-label {
    font-size: 12.5px; font-weight: 700; color: var(--ink);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .factory-selector { display: flex; flex-wrap: wrap; gap: 7px; }
  .factory-toggle {
    padding: 5px 11px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
    border: 1px solid var(--border-strong); background: #fff; color: var(--ink-2);
    transition: all 130ms;
  }
  .factory-toggle:hover { border-color: var(--primary); color: var(--primary); }
  .factory-toggle.selected {
    background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600;
  }

  .pkg-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .pkg-option {
    text-align: left; padding: 11px 12px; border-radius: 10px;
    border: 1.5px solid var(--border); background: #fff;
    display: flex; flex-direction: column; gap: 5px; transition: all 140ms;
  }
  .pkg-option:hover { border-color: #8cc9be; background: #fafefd; }
  .pkg-option.selected {
    border-color: var(--primary); background: #edf9f6;
    box-shadow: 0 0 0 2px rgba(0, 101, 89, .12);
  }
  .pkg-option-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .pkg-option-name { font-weight: 700; font-size: 13px; color: var(--ink); }
  .pkg-option-desc { font-size: 11.5px; color: var(--muted); line-height: 1.4; }
  .pkg-option-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

  /* Live Diff Radar */
  .diff-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .diff-kpi {
    background: #fff; border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .diff-kpi strong { font-size: 20px; line-height: 1.1; }
  .diff-kpi span { font-size: 11px; color: var(--muted); }
  .diff-kpi.add { border-color: #b7e4d3; background: #f2fbf7; }
  .diff-kpi.add strong { color: var(--emerald); }
  .diff-kpi.rem { border-color: var(--red-border); background: #fff7f7; }
  .diff-kpi.rem strong { color: var(--red); }

  .diff-group { background: #fff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .diff-group-head {
    padding: 8px 11px; font-size: 12px; font-weight: 700; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .diff-group-head.add { background: #effaf5; color: var(--emerald); }
  .diff-group-head.rem { background: #fff3f4; color: var(--red); }
  .diff-group-head.deny { background: #fff0f0; color: #9c1622; }
  .diff-list { list-style: none; margin: 0; padding: 6px 10px; display: flex; flex-direction: column; gap: 5px; max-height: 190px; overflow-y: auto; }
  .diff-list li {
    font-size: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 4px 0; border-bottom: 1px dashed #edf2f4;
  }
  .diff-list li:last-child { border-bottom: none; }

  /* ── VIEW 2: PEOPLE DIRECTORY (人员与权限) ── */
  .people-layout {
    flex: 1; min-height: 0; display: grid; grid-template-columns: 226px minmax(0, 1fr); gap: 14px; overflow: hidden;
  }
  .org-tree { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 3px; }
  .org-group-label {
    font-size: 11px; font-weight: 700; color: var(--muted); padding: 10px 10px 4px;
    letter-spacing: .04em;
  }
  .org-node {
    width: 100%; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--ink-2);
    transition: all 130ms;
  }
  .org-node:hover { background: var(--surface-subtle); color: var(--ink); }
  .org-node.active { background: var(--primary-soft); color: var(--primary-ink); font-weight: 700; }
  .org-node .count {
    font-size: 11.5px; padding: 1px 7px; border-radius: 99px;
    background: #edf2f4; color: var(--muted);
  }
  .org-node.active .count { background: var(--primary); color: #fff; }

  .toolbar {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: #fff; flex-shrink: 0;
  }
  .table-wrap { flex: 1; overflow: auto; }
  table.data-table { width: 100%; border-collapse: collapse; min-width: 880px; }
  table.data-table th {
    position: sticky; top: 0; z-index: 2;
    background: #f4f8fa; color: var(--muted); font-size: 11.5px; font-weight: 700;
    text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  table.data-table td {
    padding: 11px 14px; border-bottom: 1px solid #eef3f5; vertical-align: middle;
  }
  table.data-table tbody tr { transition: background 120ms; cursor: pointer; }
  table.data-table tbody tr:hover { background: #f6fbfa; }
  .person-cell { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
    background: var(--primary-soft); color: var(--primary-ink);
    font-weight: 700; font-size: 14px; display: grid; place-items: center;
  }
  .avatar.legacy { background: var(--amber-bg); color: var(--amber); }
  .avatar.suspended { background: #eef2f4; color: #6c7d87; }
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 5px; }

  /* ── 68% WIDE PERSON STUDIO DRAWER ── */
  .drawer-backdrop {
    position: fixed; inset: 0; background: rgba(12, 30, 36, .38); backdrop-filter: blur(2px);
    z-index: 50; display: flex; justify-content: flex-end;
    opacity: 0; pointer-events: none; transition: opacity 200ms;
  }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    width: min(1060px, 76vw); max-width: 100vw; height: 100%; background: #fff;
    box-shadow: var(--shadow-drawer); display: flex; flex-direction: column;
    transform: translateX(28px); transition: transform 240ms var(--ease);
  }
  .drawer-backdrop.open .drawer { transform: translateX(0); }
  .drawer-header {
    padding: 16px 22px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: linear-gradient(180deg, #f8fcfb, #fff); flex-shrink: 0;
  }
  .drawer-tabs {
    padding: 0 22px; border-bottom: 1px solid var(--border); background: #fff;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .drawer-tab {
    padding: 11px 14px; font-size: 13px; font-weight: 600; color: var(--muted);
    border-bottom: 2px solid transparent; transition: all 140ms;
  }
  .drawer-tab:hover { color: var(--ink); }
  .drawer-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .drawer-body { flex: 1; min-height: 0; display: flex; overflow: hidden; }

  .pkg-slot-card {
    border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px; background: #fff;
    display: flex; flex-direction: column; gap: 9px;

/* ============================================================================
   UTILITIES & DIFF ENGINE
   ============================================================================ */
function computePermSet(roleIds, factories) {
  const map = new Map();
  (roleIds || []).forEach(rid => {
    const r = roleById(rid);
    if (!r) return;
    r.perms.forEach(code => {
      const fList = (factories && factories.length) ? factories : ['huadeng'];
      if (!map.has(code)) map.set(code, new Set());
      fList.forEach(f => map.get(code).add(f));
    });
  });
  return map;
}

function diffPermissions(beforeRoleIds, beforeFactories, afterRoleIds, afterFactories) {
  const before = computePermSet(beforeRoleIds, beforeFactories);
  const after = computePermSet(afterRoleIds, afterFactories);
  const added = [], removed = [], retained = [];
  after.forEach((fSet, code) => {
    if (!before.has(code)) {
      added.push({ code, factories: [...fSet] });
    } else {
      const bf = before.get(code);
      const extraF = [...fSet].filter(f => !bf.has(f));
      if (extraF.length) added.push({ code, factories: extraF, scopeExpand: true });
      else retained.push({ code, factories: [...fSet] });
    }
  });
  before.forEach((fSet, code) => {
    if (!after.has(code)) removed.push({ code, factories: [...fSet] });
  });
  const highRisk = added.length > 0 || added.some(x => permInfo(x.code).risk === 'high');
  return { added, removed, retained, highRisk };
}

function showToast(msg) {
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6ee7c8" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg><span>${msg}</span>`;
  host.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 220ms'; setTimeout(() => el.remove(), 220); }, 3200);
}

            <p style="margin:0 0 10px;font-size:12.5px;color:var(--ink-2)">批准后将向申请人原浏览器开放 <b>4 小时</b>自主设新密码窗口；<b>批准动作本身不改原密码、不撤销现有会话</b>，直到本人完成改密才原子撤销所有旧会话。</p>
            <label style="display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer">
              <input type="checkbox" ${state.pwdVerified ? 'checked' : ''} onchange="state.pwdVerified=this.checked;render()" />
              我已通过电话/当面核实申请人确为 ${t.personName} 本人
            </label>
          </div>
        </div>
        <div class="review-footer">
          <span style="font-size:12.5px;color:var(--muted)">原浏览器凭证采用 SHA-256 摘要校验，不派发临时明文密码</span>
          <div style="display:flex;gap:8px">
            <button class="btn btn-danger-outline" onclick="completeTask('${t.key}','已拒绝密码找回申请')">拒绝申请</button>
            <button class="btn btn-primary" ${state.pwdVerified ? '' : 'disabled'} onclick="completeTask('${t.key}','已批准密码找回，开放 4 小时原浏览器改密窗口')">批准并开放改密窗口</button>
          </div>
        </div>
      </div>
    `;
  }

  if (t.kind === 'identity-change') {
    return `
      <div class="review-shell">
        <div class="review-top-banner">
          <div>
            <div style="display:flex;align-items:center;gap:8px">
              <h2 style="margin:0;font-size:17px">${t.personName}</h2>
              <span class="pill pill-violet">跨厂 / 高危变更待复核</span>
            </div>
            <div style="font-size:12.5px;color:var(--muted);margin-top:2px">发起人：${t.requester} · 提交于 ${t.createdAt}</div>
          </div>
          <button class="btn btn-sm btn-outline" onclick="openPersonDrawer('${t.userId}')">查看人员360°档案</button>
        </div>
        <div style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px">
          <div class="compare-strip">
            <div class="compare-box">
              <div class="compare-label">变更前（Before）</div>
              <div class="compare-main">仓库经理 · fixed-v32</div>
              <div class="compare-sub">覆盖：全 6 个生产厂区</div>
            </div>
            <div style="text-align:center;color:var(--primary);font-weight:700">→</div>
            <div class="compare-box after">
              <div class="compare-label">申请变更（After）</div>
              <div class="compare-main">仓库经理 · fixed-v34（升级包版本）</div>
              <div class="compare-sub">覆盖：全 6 个生产厂区 · 新增 1 项高风险权限</div>
            </div>
          </div>
          <div style="padding:14px;border-radius:10px;border:1px solid var(--border)">
            <div class="section-label" style="margin-bottom:6px">变更原因与越权说明</div>
            <div style="font-size:13px;color:var(--ink-2)">${t.reason}</div>
          </div>
          <div class="diff-group">
            <div class="diff-group-head add"><span>+ 升级后净新增权限（全6厂）</span><span>1 项</span></div>
            <ul class="diff-list">
              <li><span><b>纸箱采购下单与对账</b> <span class="mono" style="color:var(--muted)">carton_procurement:manage</span></span><span class="pill pill-red">高风险</span></li>
            </ul>
          </div>
        </div>
        <div class="review-footer">
          <span style="font-size:12.5px;color:var(--muted)">批准后将持有写锁并按幂等键原子生效，旧版本历史快照保留可追溯</span>
          <div style="display:flex;gap:8px">
            <button class="btn btn-danger-outline" onclick="completeTask('${t.key}','已驳回该跨厂变更复核单')">驳回变更</button>
            <button class="btn btn-primary" onclick="approveIdentityUpgrade('${t.key}')">批准并立即生效</button>
          </div>
        </div>
      </div>
    `;
  }

  // Registration & Employee Position/Permission Change (Dual-Engine Live Studio)
  const isReg = t.kind === 'registration';
  const beforeRoles = isReg ? [] : t.currentRoleIds;
  const beforeFacs = isReg ? [] : t.currentFactories;
  const effectiveRoles = t.decisionMode === 'keep_permissions' ? beforeRoles : t.selectedRoleIds;
  const effectiveFacs = t.decisionMode === 'keep_permissions' ? beforeFacs : t.selectedFactories;
  const diff = diffPermissions(beforeRoles, beforeFacs, effectiveRoles, effectiveFacs);
  const canSubmit = (t.decisionMode === 'keep_permissions' || (t.selectedRoleIds.length > 0 && t.selectedFactories.length > 0))
                    && (!diff.highRisk || state.reviewRiskChecked);

  // Recommend department-matched roles first
  const sortedRoles = [...ROLES].sort((a, b) => (b.dept === t.dept ? 1 : 0) - (a.dept === t.dept ? 1 : 0));

  return `
    <div class="review-shell">
      <div class="review-top-banner">
        <div style="display:flex;align-items:center;gap:12px">
          <span class="avatar" style="${isReg ? 'background:#e8f2ff;color:#1c5da6' : ''}">${t.personName.slice(0,1)}</span>
          <div>
            <div style="display:flex;align-items:center;gap:8px">
              <h2 style="margin:0;font-size:16.5px">${t.personName}</h2>
              <span class="pill ${isReg ? 'pill-blue' : 'pill-primary'}">${isReg ? '新员工注册开通' : '员工岗位与权限申请'}</span>
              <span style="font-size:12px;color:var(--muted)">@${t.username}</span>
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">提交于 ${t.createdAt} · 组织：${orgName(t.orgId)} · ${deptName(t.dept)}</div>
          </div>
        </div>
        ${t.userId ? `<button class="btn btn-sm btn-outline" onclick="openPersonDrawer('${t.userId}')">打开此人完整档案</button>` : ''}
      </div>

      <div class="review-dual">
        <!-- LEFT ENGINE: Verify + Assemble Packages -->
        <div class="review-left">
          ${isReg ? `
            <div class="info-grid-4">
              <div class="info-cell"><label>注册账号</label><strong>${t.username}</strong></div>
              <div class="info-cell"><label>申请姓名</label><strong>${t.personName}</strong></div>
              <div class="info-cell"><label>手机号码</label><strong class="num">${t.phone}</strong></div>
              <div class="info-cell"><label>企业邮箱</label><strong>${t.email}</strong></div>
            </div>
          ` : `
            <div class="compare-strip">
              <div class="compare-box">
                <div class="compare-label">当前正式岗位（Before）</div>
                <div class="compare-main">${t.currentPos}</div>
                <div class="compare-sub">${orgName(t.beforeOrgId)} · ${deptName(t.beforeDept)}</div>
                <div class="chip-wrap" style="margin-top:6px">
                  ${t.currentRoleIds.map(id => `<span class="pkg-chip">${roleById(id)?.name}</span>`).join('')}
                </div>
              </div>
              <div style="text-align:center;color:var(--primary);font-weight:700">→</div>
              <div class="compare-box after">
                <div class="compare-label">员工本次申报（After）</div>
                <div class="compare-main">${t.proposedPos}</div>
                <div class="compare-sub">${orgName(t.orgId)} · ${deptName(t.dept)}</div>
                ${t.employeeRequestedRoles?.length ? `
                  <div style="margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                    <span class="pill pill-amber">员工参考期望</span>
                    ${t.employeeRequestedRoles.map(id => `<span class="pkg-chip">${roleById(id)?.name}</span>`).join('')}
                    <button class="btn btn-sm btn-soft" style="height:22px;padding:0 8px;font-size:11px" onclick="adoptEmployeeSuggestion('${t.key}')">一键采纳</button>
                  </div>
                ` : ''}
              </div>
            </div>
          `}

          ${t.note ? `<div style="font-size:12.5px;color:var(--ink-2);padding:9px 12px;border-radius:8px;background:var(--surface-subtle);border-left:3px solid var(--primary)"><b>申报备注：</b>${t.note}</div>` : ''}

          ${!isReg ? `
            <div style="display:flex;gap:8px">
              <button class="factory-toggle ${t.decisionMode === 'apply_package' ? 'selected' : ''}" onclick="setTaskDecisionMode('${t.key}','apply_package')">调整并分配权限包</button>
              <button class="factory-toggle ${t.decisionMode === 'keep_permissions' ? 'selected' : ''}" onclick="setTaskDecisionMode('${t.key}','keep_permissions')">仅确认岗位名，严格保留原权限</button>
            </div>
          ` : ''}

          ${t.decisionMode !== 'keep_permissions' ? `
            <div>
              <div class="section-label" style="margin-bottom:8px">
                <span>1. 业务作用厂区（多选胶囊）</span>
                <button class="btn btn-sm btn-ghost" onclick="selectAllTaskFactories('${t.key}')">全选 6 厂</button>
              </div>
              <div class="factory-selector">
                ${FACTORIES.map(f => `
                  <button class="factory-toggle ${t.selectedFactories.includes(f.id) ? 'selected' : ''}"
                    onclick="toggleTaskFactory('${t.key}','${f.id}')">${f.name}</button>
                `).join('')}
              </div>
            </div>

            <div>
              <div class="section-label" style="margin-bottom:8px">
                <span>2. 选择内置权限包（可单选或叠加多包，已将本部门匹配项置顶）</span>
                <span style="font-size:11.5px;color:var(--muted)">已选 ${t.selectedRoleIds.length} 个</span>
              </div>
              <div class="pkg-grid">
                ${sortedRoles.map(r => {
                  const sel = t.selectedRoleIds.includes(r.id);
                  const matched = r.dept === t.dept;
                  return `
                    <button class="pkg-option ${sel ? 'selected' : ''}" onclick="toggleTaskRole('${t.key}','${r.id}')">
                      <div class="pkg-option-top">
                        <span class="pkg-option-name">${r.name}</span>
                        <span class="pill ${sel ? 'pill-emerald' : 'pill-slate'} num">${r.totalPerms} 项</span>
                      </div>
                      <div class="pkg-option-desc">${r.desc}</div>
                      <div class="pkg-option-meta">
                        ${matched ? `<span class="pill pill-primary">推荐匹配</span>` : ''}
                        <span class="pill pill-slate">${r.scopeText}</span>
                        <span class="mono" style="color:var(--muted);font-size:11px">${r.version}</span>
                      </div>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          ` : `
            <div style="padding:14px;border-radius:10px;background:#f4fbf9;border:1px solid #c2e3dc;font-size:13px;color:var(--ink-2)">
              已选择<b>「仅确认岗位名称，保留原权限」</b>：提交时后端将校验变更前后「权限码 × 厂区 × 部门」集合 100% 零差异，原有固定版本与独立例外全部保持不变。
            </div>
          `}
        </div>

        <!-- RIGHT ENGINE: Live Diff Radar -->
        <div class="review-right">
          <div class="section-label">
            <span style="display:flex;align-items:center;gap:6px">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              实时权限影响雷达（Live Diff）
            </span>
            <span class="pill pill-emerald pill-dot">预览有效 4:58</span>
          </div>
          ${renderLiveDiffPanel(diff, [])}
        </div>
      </div>

      <!-- Sticky Decision Footer -->
      <div class="review-footer">
        <div style="display:flex;align-items:center;gap:12px;flex:1;min-width:0">
          ${diff.highRisk ? `
            <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--amber);background:var(--amber-bg);padding:6px 11px;border-radius:8px;border:1px solid var(--amber-border);cursor:pointer">
              <input type="checkbox" ${state.reviewRiskChecked ? 'checked' : ''} onchange="state.reviewRiskChecked=this.checked;render()" />
              我已核对本次新增的 ${diff.added.length} 项权限及覆盖厂区范围
            </label>
          ` : `<span class="pill pill-emerald pill-dot">无新增权限，安全就绪</span>`}
        </div>
        ${state.reviewRejectOpen ? `
          <div style="display:flex;align-items:center;gap:8px">
            <input class="input" style="width:240px" placeholder="请输入${isReg ? '拒绝' : '退回'}原因（必填）" value="${state.reviewRejectReason}" oninput="state.reviewRejectReason=this.value" />
            <button class="btn btn-danger" onclick="submitTaskReject('${t.key}')">确认${isReg ? '拒绝' : '退回'}</button>
            <button class="btn btn-ghost" onclick="state.reviewRejectOpen=false;render()">取消</button>
          </div>
        ` : `
          <div style="display:flex;align-items:center;gap:8px">
            <button class="btn btn-danger-outline" onclick="state.reviewRejectOpen=true;state.reviewRejectReason='';render()">${isReg ? '拒绝注册' : '退回补充'}</button>
            <button class="btn btn-primary" ${canSubmit ? '' : 'disabled'} onclick="submitTaskApprove('${t.key}')">
              ${isReg ? '通过并开通分配权限' : t.decisionMode === 'keep_permissions' ? '确认岗位并保留原权限' : '确认通过并生效'}
            </button>
          </div>
        `}
      </div>
    </div>
  `;
}

function renderLiveDiffPanel(diff, explicitDenies) {
  return `
    <div class="diff-kpis">
      <div class="diff-kpi add"><strong class="num">+${diff.added.length}</strong><span>净新增权限</span></div>
      <div class="diff-kpi rem"><strong class="num">-${diff.removed.length}</strong><span>将收回权限</span></div>
      <div class="diff-kpi"><strong class="num">${diff.retained.length}</strong><span>保持不变</span></div>
    </div>

    <div class="diff-group">
      <div class="diff-group-head add"><span>+ 新增权限明细</span><span class="num">${diff.added.length} 项</span></div>
      ${diff.added.length ? `<ul class="diff-list">
        ${diff.added.map(item => {
          const info = permInfo(item.code);
          return `<li>
            <span><b>${info.name}</b> ${item.scopeExpand ? '<span class="pill pill-blue" style="height:18px;font-size:10px">扩厂</span>' : ''}</span>
            <span style="display:flex;align-items:center;gap:5px">
              ${info.risk === 'high' ? '<span class="pill pill-red" style="height:18px;font-size:10px">高风险</span>' : ''}
              <span style="color:var(--muted);font-size:11px">${item.factories.map(orgName).join('、')}</span>
            </span>
          </li>`;
        }).join('')}
      </ul>` : `<div style="padding:12px;font-size:12px;color:var(--muted)">本次操作不新增权限</div>`}
    </div>

    ${diff.removed.length ? `
      <div class="diff-group">
        <div class="diff-group-head rem"><span>- 将停止的权限</span><span class="num">${diff.removed.length} 项</span></div>
        <ul class="diff-list">
          ${diff.removed.map(item => `<li><span>${permInfo(item.code).name}</span><span style="color:var(--muted);font-size:11px">${item.factories.map(orgName).join('、')}</span></li>`).join('')}
        </ul>
      </div>
    ` : ''}

    ${explicitDenies.length ? `
      <div class="diff-group">
        <div class="diff-group-head deny"><span>⛔ 仍生效的显式禁止（不可绕过）</span><span>${explicitDenies.length}</span></div>
        <ul class="diff-list">
          ${explicitDenies.map(d => `<li><span>${permInfo(d.code).name}</span><span style="color:var(--red);font-size:11px">${orgName(d.factoryId)}</span></li>`).join('')}
        </ul>
      </div>
    ` : ''}

    <div style="font-size:11.5px;color:var(--muted);padding:8px 10px;border-radius:8px;background:#fff;border:1px solid var(--border)">
      <b>无草稿污染预览：</b>在数据库嵌套事务中实时演算，未点击确认前绝不产生脏草稿单，且自动校验自我提权与最后一位管理员保护。
    </div>
  `;
}

/* ============================================================================
   VIEW 2: PEOPLE DIRECTORY (人员全景宽表 + 左侧组织树)
   ============================================================================ */
function renderPeople() {
  const list = PEOPLE.filter(p => {
    if (state.selectedOrg !== 'all' && p.orgId !== state.selectedOrg) return false;
    if (state.peopleSearch.trim()) {
      const q = state.peopleSearch.trim().toLowerCase();
      if (![p.name, p.username, p.phone, p.position].some(v => v.toLowerCase().includes(q))) return false;
    }
    if (state.peopleRoleFilter && !p.packages.some(b => b.roleId === state.peopleRoleFilter)) return false;
    if (state.peopleModeFilter === 'legacy' && p.mode !== 'legacy') return false;
    if (state.peopleModeFilter === 'nopkg' && p.packages.length > 0) return false;
    if (state.peopleModeFilter === 'pending' && !p.openTaskKey) return false;
    return true;
  });

  const statusPill = s => s === 'active'
    ? `<span class="pill pill-emerald pill-dot">在用</span>`
    : `<span class="pill pill-slate pill-dot">已停用</span>`;

  return `
    <div class="view-container">
      <div class="people-layout">
        <!-- Left Org Tree -->
        <aside class="panel org-sidebar-panel">
          <div class="panel-header"><span class="panel-title">组织架构</span></div>
          <div class="org-tree">
            <button class="org-node ${state.selectedOrg === 'all' ? 'active' : ''}" onclick="state.selectedOrg='all';render()">
              <span>全部可见人员</span><span class="count num">${PEOPLE.length}</span>
            </button>
            <div class="org-group-label">生产厂区（6）</div>
            ${FACTORIES.map(f => {
              const c = PEOPLE.filter(p => p.orgId === f.id).length;
              return `<button class="org-node ${state.selectedOrg === f.id ? 'active' : ''}" onclick="state.selectedOrg='${f.id}';render()">
                <span>${f.name}</span><span class="count num">${c}</span>
              </button>`;
            }).join('')}
            <div class="org-group-label">集团职能</div>
            <button class="org-node ${state.selectedOrg === 'group-management' ? 'active' : ''}" onclick="state.selectedOrg='group-management';render()">
              <span>集团总务</span><span class="count num">${PEOPLE.filter(p => p.orgId === 'group-management').length}</span>
            </button>
          </div>
        </aside>

        <!-- Right High-Density Directory Table -->
        <section class="panel">
          <div class="toolbar">
            <div class="search-box" style="flex:1;min-width:200px;max-width:300px">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input class="input" placeholder="搜索姓名、账号、手机或岗位…" value="${state.peopleSearch}" oninput="state.peopleSearch=this.value;render()" />
            </div>
            <select class="select" onchange="state.peopleRoleFilter=this.value;render()">
              <option value="">按权限包筛选（全部）</option>
              ${ROLES.map(r => `<option value="${r.id}" ${state.peopleRoleFilter===r.id?'selected':''}>${r.name}</option>`).join('')}
            </select>
            <select class="select" onchange="state.peopleModeFilter=this.value;render()">
              <option value="" ${state.peopleModeFilter===''?'selected':''}>全部人员特征</option>
              <option value="legacy" ${state.peopleModeFilter==='legacy'?'selected':''}>仅看：历史来源待核实</option>
              <option value="nopkg" ${state.peopleModeFilter==='nopkg'?'selected':''}>仅看：未配置权限包</option>
              <option value="pending" ${state.peopleModeFilter==='pending'?'selected':''}>仅看：有待办申请</option>
            </select>
            <span style="margin-left:auto;font-size:12.5px;color:var(--muted)" class="num">共 ${list.length} 人 · 点击行或「配置权限」直接装配</span>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th style="width:21%">人员 / 账号</th>
                  <th style="width:18%">正式主职与归属</th>
                  <th style="width:26%">当前生效权限包（一眼看清）</th>
                  <th style="width:14%">业务覆盖厂区</th>
                  <th style="width:12%">状态 / 待办</th>
                  <th style="width:9%;text-align:right">操作</th>
                </tr>
              </thead>
              <tbody>
                ${list.map(p => {
                  const allFacs = [...new Set(p.packages.flatMap(b => b.factories))];
                  return `
                    <tr onclick="openPersonDrawer('${p.id}')">
                      <td>
                        <div class="person-cell">
                          <span class="avatar ${p.mode==='legacy'?'legacy':p.status==='suspended'?'suspended':''}">${p.name.slice(0,1)}</span>
                          <div>
                            <div style="font-weight:700;color:var(--ink)">${p.name}</div>
                            <div style="font-size:11.5px;color:var(--muted)">@${p.username} · <span class="num">${p.phone}</span></div>
                          </div>
                        </div>
                      </td>
                      <td>
                        <div style="font-weight:600">${p.position}</div>
                        <div style="font-size:12px;color:var(--muted)">${orgName(p.orgId)} · ${deptName(p.dept)}</div>
                        ${p.secondaries.length ? `<span class="pill pill-violet" style="margin-top:3px;height:19px;font-size:10.5px">+${p.secondaries.length} 兼任</span>` : ''}
                      </td>
                      <td>
                        <div class="chip-wrap">
                          ${p.packages.length ? p.packages.map(b => `
                            <span class="pkg-chip ${b.outdated ? 'outdated' : ''}">${roleById(b.roleId)?.name}</span>
                          `).join('') : `<span class="pkg-chip warn">未配置权限包</span>`}
                          ${p.mode === 'legacy' ? `<span class="pill pill-amber">历史待核实</span>` : ''}
                          ${p.overrides.some(o => o.effect==='allow') ? `<span class="pill pill-blue">+${p.overrides.filter(o=>o.effect==='allow').length} 例外</span>` : ''}
                          ${p.overrides.some(o => o.effect==='deny') ? `<span class="pill pill-red">⛔ ${p.overrides.filter(o=>o.effect==='deny').length} 禁止</span>` : ''}
                        </div>
                      </td>
                      <td>
                        <div class="chip-wrap">
                          ${allFacs.length >= 6
                            ? `<span class="factory-chip all">全部 6 厂</span>`
                            : allFacs.length ? allFacs.map(f => `<span class="factory-chip">${orgName(f)}</span>`).join('') : `<span style="color:var(--muted);font-size:12px">—</span>`}
                        </div>
                      </td>
                      <td>
                        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-start">
                          ${statusPill(p.status)}
                          ${p.openTaskKey ? `<button class="pill pill-amber" style="cursor:pointer;border:1px solid var(--amber-border)" onclick="event.stopPropagation();jumpToTask('${p.openTaskKey}')">有待审申请 →</button>` : `<span style="font-size:11px;color:var(--muted)">登录：${p.lastLogin}</span>`}
                        </div>
                      </td>
                      <td style="text-align:right">
                        <button class="btn btn-sm btn-soft" onclick="event.stopPropagation();openPersonDrawer('${p.id}')">配置权限</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  `;
}

/* ============================================================================
   68% WIDE PERSON STUDIO DRAWER (人员全景与实时配包抽屉)
   ============================================================================ */
function openPersonDrawer(personId, initialTab = 'packages') {
  const p = PEOPLE.find(x => x.id === personId);
  if (!p) return;
  state.drawerPersonId = personId;
  state.drawerTab = initialTab;
  state.drawerPickerOpen = false;
  state.drawerRiskChecked = false;
  state.drawerLifeMenuOpen = false;
  state.explainFactory = p.orgId === 'group-management' ? 'huadeng' : p.orgId;
  // Clone draft
  state.drawerDraft = {
    orgId: p.orgId,
    dept: p.dept,
    position: p.position,
    legacyConfirmed: p.mode === 'v2',
    legacyDisposition: 'assignment',
    packages: JSON.parse(JSON.stringify(p.packages)),
    secondaries: JSON.parse(JSON.stringify(p.secondaries)),
    overrides: JSON.parse(JSON.stringify(p.overrides)),
    reason: ''
  };
  renderPersonDrawer();
  document.getElementById('personDrawerBackdrop').classList.add('open');
}

function closePersonDrawer() {
  document.getElementById('personDrawerBackdrop').classList.remove('open');
  state.drawerPersonId = null;
}

function renderPersonDrawer() {
  const p = PEOPLE.find(x => x.id === state.drawerPersonId);
  if (!p || !state.drawerDraft) return;
  const d = state.drawerDraft;

  let bodyHtml = '';
  if (state.drawerTab === 'packages') bodyHtml = renderDrawerPackagesTab(p, d);
  else if (state.drawerTab === 'effective') bodyHtml = renderDrawerEffectiveTab(p);
  else bodyHtml = renderDrawerTimelineTab(p);

  document.getElementById('personDrawer').innerHTML = `
    <header class="drawer-header">
      <div style="display:flex;align-items:center;gap:12px">
        <span class="avatar ${p.mode==='legacy'?'legacy':''}" style="width:42px;height:42px;font-size:17px">${p.name.slice(0,1)}</span>
        <div>
          <div style="display:flex;align-items:center;gap:8px">
            <h2 style="margin:0;font-size:18px">${p.name}</h2>
            <span class="pill ${p.status==='active'?'pill-emerald':'pill-slate'} pill-dot">${p.status==='active'?'在用':'已停用'}</span>
            <span class="pill ${p.mode==='v2'?'pill-primary':'pill-amber'}">${p.mode==='v2'?'V2 正式任职':'历史来源待核实'}</span>
          </div>
          <div style="font-size:12.5px;color:var(--muted);margin-top:2px">@${p.username} · ${orgName(p.orgId)} · ${deptName(p.dept)} · ${p.position} · 最近登录 ${p.lastLogin}</div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:8px">
        <div class="dropdown-wrap">
          <button class="btn btn-sm btn-outline" onclick="state.drawerLifeMenuOpen=!state.drawerLifeMenuOpen;renderPersonDrawer()">
            账号生命周期 ▾
          </button>
          <div class="dropdown-menu ${state.drawerLifeMenuOpen ? 'open' : ''}">
            <button onclick="togglePersonStatus('${p.id}')">${p.status==='active'?'停用账号（立即失效会话）':'恢复账号（允许登录）'}</button>
            <button onclick="showToast('已模拟打开：冻结账号确认弹窗（保留任职历史）');state.drawerLifeMenuOpen=false;renderPersonDrawer()">冻结账号</button>
            <button class="danger" onclick="showToast('已模拟打开：办理离职与工作交接核对弹窗');state.drawerLifeMenuOpen=false;renderPersonDrawer()">办理离职与交接…</button>
          </div>
        </div>
        <button class="btn btn-sm btn-ghost" style="font-size:18px;width:32px" onclick="closePersonDrawer()" aria-label="关闭">✕</button>
      </div>
    </header>

    <nav class="drawer-tabs">
      <button class="drawer-tab ${state.drawerTab==='packages'?'active':''}" onclick="state.drawerTab='packages';renderPersonDrawer()">① 权限包直改装配台</button>
      <button class="drawer-tab ${state.drawerTab==='effective'?'active':''}" onclick="state.drawerTab='effective';renderPersonDrawer()">② 有效权限透视与验算</button>
      <button class="drawer-tab ${state.drawerTab==='timeline'?'active':''}" onclick="state.drawerTab='timeline';renderPersonDrawer()">③ 档案与变更时间线</button>
    </nav>

    <div class="drawer-body">${bodyHtml}</div>
  `;
}

function renderDrawerPackagesTab(p, d) {

  const afterRoleIds = d.packages.map(b => b.roleId);
  const afterFacs = [...new Set(d.packages.flatMap(b => b.factories))];
  const diff = diffPermissions(beforeRoleIds, beforeFacs, afterRoleIds, afterFacs);
  const changed = JSON.stringify(p.packages) !== JSON.stringify(d.packages)
               || p.position !== d.position || p.orgId !== d.orgId || p.dept !== d.dept
               || (p.mode === 'legacy' && d.legacyConfirmed);
  const denies = d.overrides.filter(o => o.effect === 'deny' && o.active);

        <!-- Left Assembler -->

              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">

                  <option value="assignment" selected>原有绑定归属：本次主职</option>
                  <option value="individual_exception">原有绑定归属：独立个人能力</option>
                  <option value="system_administration">原有绑定归属：独立系统管理</option>
                </select>
                <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--amber);cursor:pointer">

                <select class="select" style="width:100%" onchange="state.drawerDraft.orgId=this.value;renderPersonDrawer()">

          <button class="btn btn-primary" ${canCommit ? '' : 'disabled'} onclick="commitDrawerChanges()">保存并立即生效</button>
        </div>
      </footer>

}

function renderDrawerEffectiveTab(p) {
  // Calculate permission explanation chain
  const denied = p.overrides.find(o => o.effect === 'deny' && o.active && o.code === state.explainPerm && o.factoryId === state.explainFactory);
  const allowedOv = p.overrides.find(o => o.effect === 'allow' && o.active && o.code === state.explainPerm && o.factoryId === state.explainFactory);
  const matchedPkg = p.packages.find(b => b.factories.includes(state.explainFactory) && roleById(b.roleId)?.perms.includes(state.explainPerm));

  let verdict = { allow: false, text: '默认拒绝：当前生效的权限包与例外均未覆盖此厂区动作' };
  if (p.status !== 'active') verdict = { allow: false, text: '拒绝：账号已停用，所有业务动作在第一步即拦截' };
  else if (denied) verdict = { allow: false, text: `显式禁止拦截：存在明确禁止规则（优先级高于所有角色与超管）` };
  else if (allowedOv) verdict = { allow: true, text: `允许：命中个人独立允许例外（${orgName(allowedOv.factoryId)}）` };
  else if (matchedPkg) verdict = { allow: true, text: `允许：来自已绑定权限包「${roleById(matchedPkg.roleId)?.name}」（版本 ${matchedPkg.version}）` };

  // Group current permissions by module
  const byMod = new Map();
  p.packages.forEach(b => {
    const r = roleById(b.roleId);
    r?.perms.forEach(code => {
      const info = permInfo(code);
      if (!byMod.has(info.modName)) byMod.set(info.modName, []);
      if (!byMod.get(info.modName).some(x => x.code === code)) {
        byMod.get(info.modName).push({ ...info, source: r.name, factories: b.factories });
      }
    });
  });

  return `
    <div style="flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:16px">
      <!-- Permission Explain Calculator -->
      <div style="padding:14px 16px;border-radius:12px;border:1.5px solid #bfe0d9;background:#f3fbf9">
        <div class="section-label" style="margin-bottom:10px">
          <span>权限验算器（回答：此刻此人在某厂区能否执行某操作？）</span>
          <span class="pill ${verdict.allow ? 'pill-emerald' : 'pill-red'}">${verdict.allow ? '判定：允许执行' : '判定：拒绝执行'}</span>
        </div>
        <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:10px">
          <select class="select" onchange="state.explainPerm=this.value;renderPersonDrawer()">
            ${PERM_CATALOG.map(pm => `<option value="${pm.code}" ${state.explainPerm===pm.code?'selected':''}>${pm.modName} · ${pm.name} (${pm.code})</option>`).join('')}
          </select>
          <select class="select" onchange="state.explainFactory=this.value;renderPersonDrawer()">
            ${FACTORIES.map(f => `<option value="${f.id}" ${state.explainFactory===f.id?'selected':''}>目标厂区：${f.name}</option>`).join('')}
          </select>
        </div>
        <div class="decision-chain">
          <span class="chain-step ${p.status==='active'?'pass':'hit-deny'}">1. 账号可用 ${p.status==='active'?'✓':'✕'}</span>
          <span>→</span>
          <span class="chain-step ${denied?'hit-deny':'pass'}">2. 显式禁止 ${denied?'⛔ 命中拦截':'无'}</span>
          <span>→</span>
          <span class="chain-step">3. 集团超管</span>
          <span>→</span>
          <span class="chain-step ${!denied && allowedOv?'hit-allow':''}">4. 个人允许 ${!denied && allowedOv?'✓ 命中':''}</span>
          <span>→</span>
          <span class="chain-step ${!denied && !allowedOv && matchedPkg?'hit-allow':''}">5. 权限包命中 ${!denied && !allowedOv && matchedPkg?'✓ 命中':''}</span>
        </div>
        <div style="margin-top:9px;font-size:12.5px;font-weight:600;color:${verdict.allow?'var(--emerald)':'var(--red)'}">${verdict.text}</div>
      </div>

      <!-- Effective Permissions Grouped by Module -->
      <div>
        <div class="section-label" style="margin-bottom:10px">当前全部有效权限（按业务模块归类，标注授权来源）</div>
        ${byMod.size ? [...byMod.entries()].map(([modName, items]) => `
          <div class="perm-module-card">
            <div class="perm-module-head"><span>${modName}</span><span class="pill pill-primary num">${items.length} 项有效</span></div>
            ${items.map(it => `
              <div class="perm-row" style="grid-template-columns:1.4fr 75px 1.2fr 1fr">
                <div><b>${it.name}</b> <span class="mono" style="color:var(--muted)">${it.code}</span></div>

/* ============================================================================
   VIEW 3: ROLE CATALOG (权限方案库 - 模块热力条 + 反向查人 + 双方案对比)
   ============================================================================ */
function renderRoles() {
  const activeRole = roleById(state.selectedRoleId) || ROLES[0];
  const members = PEOPLE.filter(p => p.packages.some(b => b.roleId === activeRole.id));
  const compareRole = state.compareRoleId ? roleById(state.compareRoleId) : null;

  const filteredRoles = ROLES.filter(r => !state.roleSearch.trim() || `${r.name}${deptName(r.dept)}${r.desc}`.includes(state.roleSearch.trim()));
  const byDept = new Map();
  filteredRoles.forEach(r => {
    const d = deptName(r.dept);
    if (!byDept.has(d)) byDept.set(d, []);
    byDept.get(d).push(r);
  });

  // Permissions list for active role
  const perms = PERM_CATALOG.filter(pm => {
    if (!activeRole.perms.includes(pm.code)) return false;
    if (state.roleModFilter !== 'all' && pm.modName !== state.roleModFilter) return false;
    if (state.roleRiskOnly && pm.risk !== 'high') return false;
    return true;
  });

  return `
    <div class="view-container">
      <div class="roles-layout">
        <!-- Left Role List -->
        <aside class="panel">
          <div class="panel-header" style="flex-direction:column;align-items:stretch;gap:8px">
            <div class="panel-title">内置权限方案 <span class="pill pill-primary num">32 个标准包</span></div>
            <div class="search-box">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input class="input" placeholder="搜索部门或职位包…" value="${state.roleSearch}" oninput="state.roleSearch=this.value;render()" />
            </div>
          </div>
          <div class="org-tree">
            ${[...byDept.entries()].map(([dn, list]) => `
              <div class="org-group-label">${dn}</div>
              ${list.map(r => {
                const mCount = PEOPLE.filter(p => p.packages.some(b => b.roleId === r.id)).length;
                return `
                  <button class="org-node ${r.id === activeRole.id ? 'active' : ''}" onclick="state.selectedRoleId='${r.id}';state.roleModFilter='all';render()">
                    <span style="text-align:left">
                      <div>${r.name}</div>
                      <div style="font-size:11px;opacity:.75">${r.scopeText}</div>
                    </span>
                    <span style="display:flex;gap:4px;align-items:center">
                      <span class="count num" title="包含权限数">${r.totalPerms}权</span>
                      <span class="count num" style="background:${mCount?'#dcf2ec':'#f0f3f5'};color:${mCount?'var(--primary-ink)':'var(--muted)'}" title="已绑定人数">${mCount}人</span>
                    </span>
                  </button>
                `;
              }).join('')}
            `).join('')}
          </div>
        </aside>

        <!-- Right Role Detail / Compare -->
        <section class="panel">
          <div class="review-top-banner">
            <div>
              <div style="display:flex;align-items:center;gap:8px">
                <h2 style="margin:0;font-size:17.5px">${activeRole.name}</h2>
                <span class="pill pill-blue">${activeRole.scopeText}</span>
                <span class="pill pill-slate mono">${activeRole.version}</span>
                <span class="pill pill-primary num">${activeRole.totalPerms} / 249 权限</span>
              </div>
              <div style="font-size:12.5px;color:var(--muted);margin-top:3px">${activeRole.desc}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <select class="select" onchange="state.compareRoleId=this.value;render()">
                <option value="">对比另一方案…</option>
                ${ROLES.filter(r => r.id !== activeRole.id).map(r => `<option value="${r.id}" ${state.compareRoleId===r.id?'selected':''}>对比：${r.name}</option>`).join('')}
              </select>
              <button class="btn btn-primary" onclick="openQuickGrantModal('${activeRole.id}')">按此包授予员工</button>
            </div>
          </div>

          ${compareRole ? renderRoleCompareView(activeRole, compareRole) : `
            <!-- Module Coverage Heat Strip -->
            <div class="heat-strip">
              <button class="heat-chip ${state.roleModFilter==='all'?'active':''}" onclick="state.roleModFilter='all';render()">全部模块</button>
              ${activeRole.moduleStats.map(m => `
                <button class="heat-chip ${m.has===m.total && m.total>0?'full':''} ${m.has===0?'zero':''} ${state.roleModFilter===m.modName?'active':''}"
                  onclick="state.roleModFilter='${m.modName}';render()">
                  <span>${m.modName}</span>
                  <strong class="num">${m.has}/${m.total}</strong>
                </button>
              `).join('')}
            </div>

            <!-- Tabs: Permissions vs Bound Members -->
            <div class="drawer-tabs" style="justify-content:space-between">
              <div style="display:flex;gap:6px">
                <button class="drawer-tab ${state.roleTab==='permissions'?'active':''}" onclick="state.roleTab='permissions';render()">能力清单（代表项）</button>
                <button class="drawer-tab ${state.roleTab==='members'?'active':''}" onclick="state.roleTab='members';render()">已绑定人员（反向查人 · ${members.length} 人）</button>
              </div>
              ${state.roleTab==='permissions' ? `
                <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);cursor:pointer">
                  <input type="checkbox" ${state.roleRiskOnly?'checked':''} onchange="state.roleRiskOnly=this.checked;render()" /> 仅看高风险权限
                </label>
              ` : ''}
            </div>

            <div style="flex:1;overflow-y:auto;padding:16px">
              ${state.roleTab === 'permissions' ? `
                <div class="perm-module-card">
                  <div class="perm-module-head"><span>权限名称与代码</span><span>读写类型 / 风险级别</span></div>
                  ${perms.length ? perms.map(pm => `
                    <div class="perm-row">
                      <div><b>${pm.name}</b> <span class="mono" style="color:var(--muted)">${pm.code}</span></div>
                      <span class="pill pill-slate">${pm.modName}</span>
                      <span class="pill ${pm.kind==='read'?'pill-slate':'pill-blue'}">${pm.kind==='read'?'查看只读':'业务操作'}</span>
                      <span class="pill ${pm.risk==='high'?'pill-red':pm.risk==='medium'?'pill-amber':'pill-emerald'}" style="justify-self:end">${pm.risk==='high'?'高风险':pm.risk==='medium'?'中风险':'常规'}</span>
                    </div>
                  `).join('') : `<div style="padding:24px;text-align:center;color:var(--muted)">该筛选条件下无匹配权限项</div>`}
                </div>
              ` : `
                ${members.length ? `
                  <table class="data-table" style="min-width:600px">
                    <thead><tr><th>员工</th><th>归属组织 / 岗位</th><th>绑定版本</th><th>业务厂区上限</th><th style="text-align:right">操作</th></tr></thead>
                    <tbody>
                      ${members.map(p => {
                        const b = p.packages.find(x => x.roleId === activeRole.id);
                        return `
                          <tr onclick="switchAdminTab('people');openPersonDrawer('${p.id}')">
                            <td><b>${p.name}</b> <span style="color:var(--muted);font-size:12px">@${p.username}</span></td>
                            <td>${orgName(p.orgId)} · ${deptName(p.dept)} · ${p.position}</td>
                            <td><span class="pill ${b.outdated?'pill-amber':'pill-emerald'} mono">${b.version}${b.outdated?' · 可升级':''}</span></td>
                            <td>${b.factories.length>=6?'<span class="factory-chip all">全部 6 厂</span>':b.factories.map(f=>`<span class="factory-chip">${orgName(f)}</span>`).join(' ')}</td>
                            <td style="text-align:right"><button class="btn btn-sm btn-soft">调整此人权限</button></td>
                          </tr>
                        `;
                      }).join('')}
                    </tbody>
                  </table>
                ` : `<div class="empty-state">当前可见范围内尚无员工绑定「${activeRole.name}」</div>`}
              `}
            </div>
          `}
        </section>
      </div>
    </div>
  `;
}

function renderRoleCompareView(roleA, roleB) {
  const onlyA = roleA.perms.filter(c => !roleB.perms.includes(c));
  const onlyB = roleB.perms.filter(c => !roleA.perms.includes(c));
  const both = roleA.perms.filter(c => roleB.perms.includes(c));
  return `
    <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-radius:10px;background:#eef6ff;border:1px solid #c9dffb">
        <div style="font-size:13px"><b>方案对比模式：</b>${roleA.name}（${roleA.totalPerms}项） vs ${roleB.name}（${roleB.totalPerms}项）</div>
        <button class="btn btn-sm btn-outline" onclick="state.compareRoleId='';render()">退出对比</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
        <div class="diff-group">
          <div class="diff-group-head add"><span>仅「${roleA.name}」拥有</span><span class="num">${onlyA.length}</span></div>
          <ul class="diff-list">${onlyA.length ? onlyA.map(c => `<li><span>${permInfo(c).name}</span></li>`).join('') : '<li style="color:var(--muted)">无独有项</li>'}</ul>
        </div>
        <div class="diff-group">
          <div class="diff-group-head" style="background:#f3f7f9;color:var(--ink)"><span>两方案共同拥有</span><span class="num">${both.length}</span></div>
          <ul class="diff-list">${both.map(c => `<li><span>${permInfo(c).name}</span></li>`).join('')}</ul>
        </div>
        <div class="diff-group">
          <div class="diff-group-head" style="background:var(--violet-bg);color:var(--violet)"><span>仅「${roleB.name}」拥有</span><span class="num">${onlyB.length}</span></div>
          <ul class="diff-list">${onlyB.length ? onlyB.map(c => `<li><span>${permInfo(c).name}</span></li>`).join('') : '<li style="color:var(--muted)">无独有项</li>'}</ul>
        </div>
      </div>
    </div>
  `;
}

  // Group effective permissions

  me.packages.forEach(b => {
    roleById(b.roleId)?.perms.forEach(code => {
      const info = permInfo(code);
      if (!mods.has(info.modName)) mods.set(info.modName, []);
      mods.get(info.modName).push(info);
    });
  });

  return `
    <div class="view-scroll">
      <div class="self-wrap">
        <!-- Hero Identity Card -->
        <section class="hero-self">
          <div>
            <div style="font-size:12px;opacity:.8;margin-bottom:4px">我的正式岗位与生效权限包（员工视角 · /account/position）</div>
            <h1 style="margin:0;font-size:24px">${me.name} · ${me.position}</h1>

              <span class="pill" style="background:rgba(255,255,255,.16);color:#fff">生效厂区：${[...new Set(me.packages.flatMap(b=>b.factories))].map(orgName).join('、')}</span>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end">

            <span style="font-size:11.5px;opacity:.78">提交申请不会立即改变权限，须经管理员审核通过</span>
          </div>

        <!-- 4-Step Visual Progress Tracker -->
        <section class="panel" style="padding:16px 18px">

            <div class="step-node ${stepState==='returned'?'current':''}"><strong>3. 退回补充（如有）</strong><span style="font-size:11.5px;color:var(--muted)">${state.selfReturnComment || '无退回记录'}</span></div>
            <div class="step-node ${!openTask && stepState==='applied'?'done':''}"><strong>4. 正式生效</strong><span style="font-size:11.5px;color:var(--muted)">${!openTask && stepState==='applied'?'新权限已启用':'等待审核通过'}</span></div>

        <!-- Grouped Effective Permissions Map -->
        <section>
          <div class="section-label" style="margin-bottom:10px">我当前可用的业务能力图谱（按模块归类，清晰区分查看与操作）</div>

            ${[...mods.entries()].map(([mName, items]) => `

                <div style="display:flex;justify-content:space-between;align-items:center">

            `).join('')}
          </div>
        </section>
      </div>
    </div>
  `;
