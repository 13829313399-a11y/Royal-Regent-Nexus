/* ============================================================================
   INTERACTIVE HANDLERS
   ============================================================================ */
function toggleInboxTrack(key) {
  state.inboxTrack = state.inboxTrack === key ? 'all' : key;
  state.reviewRiskChecked = false;
  state.reviewRejectOpen = false;
  render();
}
function selectTask(key) {
  state.selectedTaskKey = key;
  state.reviewRiskChecked = false;
  state.reviewRejectOpen = false;
  state.pwdVerified = false;
  render();
}
function jumpToTask(key) {
  state.inboxTrack = 'all';
  state.selectedTaskKey = key;
  switchAdminTab('inbox');
}
function setTaskDecisionMode(key, mode) {
  const t = TASKS.find(x => x.key === key);
  if (t) { t.decisionMode = mode; state.reviewRiskChecked = false; render(); }
}
function toggleTaskFactory(key, fid) {
  const t = TASKS.find(x => x.key === key);
  if (!t) return;
  t.selectedFactories = t.selectedFactories.includes(fid) ? t.selectedFactories.filter(x => x !== fid) : [...t.selectedFactories, fid];
  state.reviewRiskChecked = false;
  render();
}
function selectAllTaskFactories(key) {
  const t = TASKS.find(x => x.key === key);
  if (t) { t.selectedFactories = FACTORIES.map(f => f.id); state.reviewRiskChecked = false; render(); }
}
function toggleTaskRole(key, rid) {
  const t = TASKS.find(x => x.key === key);
  if (!t) return;
  t.selectedRoleIds = t.selectedRoleIds.includes(rid) ? t.selectedRoleIds.filter(x => x !== rid) : [...t.selectedRoleIds, rid];
  state.reviewRiskChecked = false;
  render();
}
function adoptEmployeeSuggestion(key) {
  const t = TASKS.find(x => x.key === key);
  if (!t) return;
  t.decisionMode = 'apply_package';
  t.selectedRoleIds = [...t.employeeRequestedRoles];
  t.selectedFactories = [...t.employeeRequestedFactories];
  state.reviewRiskChecked = false;
  showToast('已一键采纳员工参考期望包与厂区，请核对右侧 Live Diff');
  render();
}
function submitTaskApprove(key) {
  const t = TASKS.find(x => x.key === key);
  if (!t) return;
  if (t.kind === 'registration') {
    PEOPLE.unshift({
      id: 'u-new-' + Date.now(), name: t.personName, username: t.username, phone: t.phone, email: t.email,
      orgId: t.orgId, dept: t.dept, position: t.proposedPos, status: 'active', mode: 'v2', lastLogin: '从未登录',
      packages: t.selectedRoleIds.map((rid, i) => ({ id: 'bn-' + i, roleId: rid, dept: t.dept, factories: [...t.selectedFactories], primary: true, version: 'fixed-v34', outdated: false })),
      secondaries: [], overrides: [], openTaskKey: null,
      history: [{ time: '刚刚', actor: '集团管理员', title: '新员工注册审核通过并开通', detail: `分配权限包：${t.selectedRoleIds.map(id=>roleById(id)?.name).join('、')}` }]
    });
    AUDIT_LOGS.unshift({
      id: 'aud-' + Date.now(), type: 'registration', time: '刚刚', actor: '集团管理员', target: `${t.personName}（${t.username}）`,
      summary: '新员工注册审核通过并开通分配权限包', commandId: 'cmd-' + Math.random().toString(16).slice(2,8),
      before: '待审注册账号', after: `在用账号 · ${orgName(t.orgId)} · ${t.proposedPos}（${t.selectedRoleIds.map(id=>roleById(id)?.name).join('、')}）`,
      added: t.selectedRoleIds.flatMap(id => roleById(id)?.perms.slice(0,2) || []), removed: []
    });
  } else if (t.kind === 'position' && t.userId) {
    const p = PEOPLE.find(x => x.id === t.userId);
    if (p) {
      p.orgId = t.orgId; p.dept = t.dept; p.position = t.proposedPos; p.openTaskKey = null;
      if (t.decisionMode !== 'keep_permissions') {
        p.packages = t.selectedRoleIds.map((rid, i) => ({ id: 'bp-' + i, roleId: rid, dept: t.dept, factories: [...t.selectedFactories], primary: true, version: 'fixed-v34', outdated: false }));
      }
      p.history.unshift({ time: '刚刚', actor: '集团管理员', title: '审批通过岗位与权限调整', detail: `正式岗位：${t.proposedPos}；权限包：${p.packages.map(b=>roleById(b.roleId)?.name).join('、')}` });
      if (p.id === 'u-lin') state.selfReviewStatus = 'applied';
    }
    AUDIT_LOGS.unshift({
      id: 'aud-' + Date.now(), type: 'position', time: '刚刚', actor: '集团管理员', target: `${t.personName}（${t.username}）`,
      summary: '员工改岗与权限变更审批通过', commandId: 'cmd-' + Math.random().toString(16).slice(2,8),
      before: `${t.currentPos}`, after: `${t.proposedPos} · ${t.selectedRoleIds.map(id=>roleById(id)?.name).join('、')}`,
      added: ['internal_quote:approve'], removed: []
    });
  }
  TASKS = TASKS.filter(x => x.key !== key);
  state.reviewRiskChecked = false;
  showToast(`已办结「${t.personName}」，权限已生效并自动切换下一条待办`);
  render();
}
function submitTaskReject(key) {
  if (!state.reviewRejectReason.trim()) { showToast('请先填写拒绝或退回原因'); return; }
  const t = TASKS.find(x => x.key === key);
  if (t?.userId === 'u-lin') { state.selfReviewStatus = 'returned'; state.selfReturnComment = state.reviewRejectReason.trim(); }
  TASKS = TASKS.filter(x => x.key !== key);
  state.reviewRejectOpen = false;
  showToast(`已${t?.kind==='registration'?'拒绝注册':'退回员工补充'}：${t?.personName}`);
  render();
}
function approveIdentityUpgrade(key) {
  const p = PEOPLE.find(x => x.id === 'u-zhang');
  if (p) { p.packages[0].version = 'fixed-v34'; p.packages[0].outdated = false; p.openTaskKey = null; }
  completeTask(key, '已批准跨厂版本升级，张敏权限包已更新至 fixed-v34');
}
function completeTask(key, msg) {
  TASKS = TASKS.filter(x => x.key !== key);
  state.pwdVerified = false;
  showToast(msg);
  render();
}

// Drawer mutations
function addDrawerPackage(rid) {
  const d = state.drawerDraft;
  const defaultFac = d.orgId === 'group-management' ? ['huadeng', 'huaxing'] : [d.orgId];
  d.packages.push({ id: 'new-' + Date.now(), roleId: rid, dept: roleById(rid)?.dept || d.dept, factories: defaultFac, primary: true, version: 'fixed-v34', outdated: false });
  state.drawerPickerOpen = false;
  state.drawerRiskChecked = false;
  renderPersonDrawer();
}
function removeDrawerPackage(idx) {
  state.drawerDraft.packages.splice(idx, 1);
  state.drawerRiskChecked = false;
  renderPersonDrawer();
}
function upgradeDrawerPkg(idx) {
  state.drawerDraft.packages[idx].version = 'fixed-v34';
  state.drawerDraft.packages[idx].outdated = false;
  showToast('已标记升级至最新固定版本 fixed-v34，右侧已更新 Live Diff');
  renderPersonDrawer();
}
function toggleDrawerPkgFactory(idx, fid) {
  const b = state.drawerDraft.packages[idx];
  b.factories = b.factories.includes(fid) ? b.factories.filter(x => x !== fid) : [...b.factories, fid];
  state.drawerRiskChecked = false;
  renderPersonDrawer();
}
function toggleAllDrawerPkgFactories(idx) {
  const b = state.drawerDraft.packages[idx];
  const home = state.drawerDraft.orgId === 'group-management' ? ['huadeng'] : [state.drawerDraft.orgId];
  b.factories = b.factories.length >= 6 ? home : FACTORIES.map(f => f.id);
  state.drawerRiskChecked = false;
  renderPersonDrawer();
}
function addDemoSecondary() {
  state.drawerDraft.secondaries.push({
    id: 'sec-' + Date.now(), orgId: 'huaxing', dept: 'qc', title: '跨厂品质支援', type: 'temporary', until: '2026-12-31', roleId: 'position_qc_manager'
  });
  renderPersonDrawer();
}
function toggleDemoSelfApprove() {
  const ovs = state.drawerDraft.overrides;
  const idx = ovs.findIndex(o => o.code === 'internal_quote:self_approve');
  if (idx >= 0) ovs.splice(idx, 1);
  else ovs.push({ id: 'ov-' + Date.now(), code: 'internal_quote:self_approve', effect: 'allow', factoryId: state.drawerDraft.orgId==='group-management'?'huadeng':state.drawerDraft.orgId, dept: 'sales-business', active: true });
  renderPersonDrawer();
}
function commitDrawerChanges() {
  const p = PEOPLE.find(x => x.id === state.drawerPersonId);
  const d = state.drawerDraft;
  if (!p || !d) return;
  const wasLegacy = p.mode === 'legacy';
  p.orgId = d.orgId; p.dept = d.dept; p.position = d.position;
  p.packages = JSON.parse(JSON.stringify(d.packages));
  p.secondaries = JSON.parse(JSON.stringify(d.secondaries));
  p.overrides = d.overrides.filter(o => o.active);
  if (wasLegacy && d.legacyConfirmed) p.mode = 'v2';
  p.history.unshift({
    time: '刚刚', actor: '集团管理员',
    title: wasLegacy ? '一步核实历史来源并更新权限包' : '直改台更新职位与权限包',
    detail: `主职：${orgName(p.orgId)}·${p.position}；生效包：${p.packages.map(b=>roleById(b.roleId)?.name).join('、') || '无'}`
  });
  AUDIT_LOGS.unshift({
    id: 'aud-' + Date.now(), type: 'position', time: '刚刚', actor: '集团管理员', target: `${p.name}（${p.username}）`,
    summary: wasLegacy ? 'Legacy 账号一步转正并应用权限包' : '管理员直改人员权限包配置',
    commandId: 'cmd-' + Math.random().toString(16).slice(2,8),
    before: '原有效配置快照', after: `${orgName(p.orgId)}·${p.position} · ${p.packages.map(b=>roleById(b.roleId)?.name).join('、') || '清空'}`,
    added: [], removed: []
  });
  closePersonDrawer();
  showToast(`已原子保存「${p.name}」的权限配置并刷新宽表`);
  render();
}
function togglePersonStatus(pid) {
  const p = PEOPLE.find(x => x.id === pid);
  if (!p) return;
  p.status = p.status === 'active' ? 'suspended' : 'active';
  state.drawerLifeMenuOpen = false;
  showToast(p.status === 'suspended' ? `已停用「${p.name}」，所有活跃登录会话立即失效` : `已恢复「${p.name}」，可重新登录`);
  renderPersonDrawer();
  render();
}

// Quick grant modal from Role Catalog
function openQuickGrantModal(roleId) {
  const role = roleById(roleId);
  openModal(`
    <div class="modal-head">
      <strong style="font-size:16px">将「${role.name}」授予员工</strong>
      <button class="btn btn-sm btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="font-size:12.5px;color:var(--muted)">选择一位员工，系统将自动打开其 68% 宽实时权限装配抽屉并预加载此权限包（仍须核对 Live Diff 后确认生效）。</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${PEOPLE.map(p => `
          <button class="queue-item" style="border:1px solid var(--border);flex-direction:row;align-items:center;justify-content:space-between"
            onclick="closeModal();switchAdminTab('people');openPersonDrawer('${p.id}');if(!state.drawerDraft.packages.some(b=>b.roleId==='${roleId}')) addDrawerPackage('${roleId}')">
            <span><b>${p.name}</b> <span style="color:var(--muted);font-size:12px">@${p.username} · ${orgName(p.orgId)} · ${p.position}</span></span>
            <span class="btn btn-sm btn-soft">选中并预装此包 →</span>
          </button>
        `).join('')}
      </div>
    </div>
  `);
}

// Self-service apply modal
function openSelfApplyModal() {
  openModal(`
    <div class="modal-head">
      <strong style="font-size:16px">申请调整岗位 / 权限</strong>
      <button class="btn btn-sm btn-ghost" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">申报岗位名称 *</label>
          <input id="selfPosInput" class="input" style="width:100%" value="业务主管" />
        </div>
        <div>
          <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">所在组织</label>
          <select id="selfOrgInput" class="select" style="width:100%">
            ${FACTORIES.map(f => `<option value="${f.id}" ${f.id==='huadeng'?'selected':''}>${f.name}</option>`).join('')}
          </select>
        </div>
      </div>
      <div>
        <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">期望参考权限包（选填，仅供管理员审核参考，不直接生效）</label>
        <select id="selfRoleInput" class="select" style="width:100%">
          ${ROLES.filter(r => r.dept==='sales-business' || r.dept==='engineering').map(r => `<option value="${r.id}" ${r.id==='position_sales_supervisor'?'selected':''}>${r.name} — ${r.desc}</option>`).join('')}
        </select>
      </div>
      <div>
        <label style="display:block;font-size:12px;font-weight:600;margin-bottom:4px">变更原因说明</label>
        <textarea id="selfNoteInput" class="textarea" rows="3" style="width:100%">负责新业务小组跟单与内部报价审核，申请升级主管权限包。</textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitSelfApply()">提交给管理员审核</button>
    </div>
  `);
}

function submitSelfApply() {
  const pos = document.getElementById('selfPosInput').value.trim() || '业务主管';
  const orgId = document.getElementById('selfOrgInput').value;
  const roleId = document.getElementById('selfRoleInput').value;
  const note = document.getElementById('selfNoteInput').value.trim();
  const existing = TASKS.find(t => t.userId === 'u-lin');
  if (existing) {
    existing.proposedPos = pos; existing.orgId = orgId; existing.employeeRequestedRoles = [roleId]; existing.note = note;
  } else {
    const newKey = 'position:pr-' + Date.now();
    TASKS.unshift({
      key: newKey, kind: 'position', state: 'actionable', createdAt: '刚刚',
      userId: 'u-lin', personName: '林晓梅', username: 'linxiaomei',
      orgId, dept: 'sales-business', beforeOrgId: 'huadeng', beforeDept: 'sales-business',
      currentPos: '业务', proposedPos: pos, currentRoleIds: ['position_sales_business'], currentFactories: ['huadeng'],
      employeeRequestedRoles: [roleId], employeeRequestedFactories: [orgId],
      selectedRoleIds: [roleId], selectedFactories: [orgId], note, decisionMode: 'apply_package'
    });
    PEOPLE.find(p => p.id === 'u-lin').openTaskKey = newKey;
  }
  state.selfReviewStatus = 'pending';
  closeModal();
  showToast('已提交申请！可点击进度卡片右侧按钮切回管理员端体验审批流');
  render();
}

// Initial render
render();
</script>
