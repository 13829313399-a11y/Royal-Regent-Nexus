log_format request_timing '$remote_addr [$time_iso8601] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent '
                          'request_time=$request_time upstream_time=$upstream_response_time';

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 128m;
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 2s;

  access_log /var/log/nginx/access.log request_timing;

  # The public notice and maintenance page survive API restarts. The host flag
  # gates all business routes, including long-running/special API locations.
  set $maintenance_gate 0;
  if (-f /var/run/rrn-notice/active) { set $maintenance_gate 1; }
  if ($uri ~ "^/(deployment-status\.json|maintenance\.html|health)$") { set $maintenance_gate 0; }
  if ($maintenance_gate = 1) { return 503; }
  error_page 503 /maintenance.html;

  location = /deployment-status.json {
    alias /var/run/rrn-notice/status.json;
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    error_page 404 =200 @deployment_idle;
  }
  location @deployment_idle {
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    return 200 '{"phase":"idle"}';
  }
  location = /maintenance.html {
    add_header Cache-Control "no-store, max-age=0" always;
    add_header Retry-After 30 always;
  }

  location = /health {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # Private collaboration streams retain Cookie auth and the full /api prefix.
  location = /api/collaboration/events {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
    add_header X-Accel-Buffering no always;
    add_header Cache-Control no-store always;
  }

  # Assistant streams use an independent timeout and disable response buffering.
  location ^~ /api/assistant/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 300s;
  }

  # Customer-order batches can contain multiple large PO workbooks/PDFs and
  # local OCR/Excel conversion may legitimately take several minutes.
  location ~ ^/api/customer-orders/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  # Ledger import/history uses the same bounded file jobs as customer orders.
  # Leave ordinary ledger reads and writes on the generic short timeout.
  location ~ ^/api/customer-order-ledger/(?:imports/[^/]+|history/(?:preview|confirm))$ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 270s;
    proxy_read_timeout 270s;
  }

  # Quote imports and authoritative recalculation may exceed the generic timeout.
  location ~ ^/api/internal-quotes(?:/|$) {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 150s;
    proxy_read_timeout 150s;
  }

  # Only Huaxing PDF renaming is synchronous; allow its 200 MiB PDF batch
  # plus multipart overhead without relaxing other API limits or timeouts.
  location ~ ^/api/tools/pdf-rename/(?:preview|execute)$ {
    client_max_body_size 205m;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
  }

  # Historical 3D counters are aggregated in the database with a 75s limit.
  location = /api/three-d-printing/operations/analytics {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 85s;
  }

  location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location = /image-translation {
    return 302 /image-translation/$is_args$args;
  }

  # Server-backed translation UI; model weights are never public static assets.
  location ^~ /image-translation/ {
    types {
      text/html html;
      application/javascript js mjs;
      text/css css;
      application/json json;
      application/wasm wasm;
      image/png png;
      image/svg+xml svg;
      font/woff2 woff2;
      font/ttf ttf;
      text/plain md;
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-cache always;
    try_files $uri $uri/ =404;
  }

  # PDF.js uses an ES module worker; older Nginx MIME maps omit .mjs.
  location ~ ^/assets/.*\.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
