log_format request_timing '$remote_addr [$time_iso8601] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent '
                          'request_time=$request_time upstream_time=$upstream_response_time';

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 128m;
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 2s;

  access_log /var/log/nginx/access.log request_timing;

  location = /health {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # Customer-order batches can contain multiple large PO workbooks/PDFs and
  # local OCR/Excel conversion may legitimately take several minutes.
  location ~ ^/api/customer-orders/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  # Quote imports and authoritative recalculation may exceed the generic timeout.
  location ~ ^/api/internal-quotes(?:/|$) {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 150s;
    proxy_read_timeout 150s;
  }

  # Only Huaxing PDF renaming is synchronous; allow its 200 MiB PDF batch
  # plus multipart overhead without relaxing other API limits or timeouts.
  location ~ ^/api/tools/pdf-rename/(?:preview|execute)$ {
    client_max_body_size 205m;
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
  }

  location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # PDF.js uses an ES module worker; older Nginx MIME maps omit .mjs.
  location ~ ^/assets/.*\.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
