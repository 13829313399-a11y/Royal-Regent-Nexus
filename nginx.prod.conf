log_format request_timing '$remote_addr [$time_iso8601] '
                          '"$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent '
                          'request_time=$request_time upstream_time=$upstream_response_time';

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20m;
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 2s;

  access_log /var/log/nginx/access.log request_timing;

  location = /health {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location = /api/ai/responses {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    # Vision requests carry validated Base64 images. Stream the request body
    # upstream so Nginx does not spool sensitive images to a temporary file.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
  }

  # Cloud-backed Office translation can require multiple sequential model calls.
  # Keep this synchronous download route aligned with the browser's 30-minute
  # timeout without relaxing the timeout for every API endpoint.
  location ~ ^/api/tools/document-translation(?:/artifact)?$ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
  }

  location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
