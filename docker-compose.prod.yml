x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  api:
    image: royal-regent-nexus-api:local
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - three-d-assets:/app/backend/data/three-d-printing-assets
      - document-assets:/app/backend/data/document-tools
      - assistant-assets:/app/backend/data/assistant
      - image-translation-models:/app/backend/models/image-translation:ro
    restart: unless-stopped
    logging: *default-logging

  document-tools-worker:
    image: royal-regent-nexus-api:local
    env_file:
      - .env.production
    command: ["python", "-m", "app.workers.document_tools"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - document-assets:/app/backend/data/document-tools
      - image-translation-models:/app/backend/models/image-translation:ro
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.document_tools", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ${DEPLOYMENT_NOTICE_DIR:-./.deployment-notice}:/var/run/rrn-notice:ro
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  three-d-assets:
  document-assets:
  assistant-assets:
  image-translation-models:
