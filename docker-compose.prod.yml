x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB is required}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  clamav:
    # Feature-release tag and persistent signatures follow the official image guidance.
    # TCP 3310 is intentionally not published to the host.
    image: clamav/clamav:1.4_base
    environment:
      FRESHCLAM_CHECKS: "6"
      CLAMD_STARTUP_TIMEOUT: "1800"
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - three-d-assets:/app/backend/data/three-d-printing-assets
      - ai-control:/app/backend/control:ro
      - ai-artifacts:/app/backend/data/ai-artifacts
    restart: unless-stopped
    logging: *default-logging

  ai-task-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["python", "-m", "app.services.ai.task_worker"]
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ai-control:/app/backend/control:ro
      - ai-artifacts:/app/backend/data/ai-artifacts
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  three-d-assets:
  ai-control:
  ai-artifacts:
  clamav-db:
