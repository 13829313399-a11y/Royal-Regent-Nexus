name: 3D secret baseline

on:
  pull_request:
    paths:
      - '**/*three_d*'
      - '**/*three-d*'
      - '**/*ThreeD*'
      - '**/*threeD*'
      - '**/three-d*/**'
      - '**/three_d*/**'
      - '**/ThreeD*/**'
      - '**/threeD*/**'
      - '.github/workflows/three-d-secret-scan.yml'
  push:
    branches: [main]
    paths:
      - '**/*three_d*'
      - '**/*three-d*'
      - '**/*ThreeD*'
      - '**/*threeD*'
      - '**/three-d*/**'
      - '**/three_d*/**'
      - '**/ThreeD*/**'
      - '**/threeD*/**'
      - '.github/workflows/three-d-secret-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan tracked 3D source and reports
        run: >-
          python backend/scripts/scan_three_d_secrets.py --tracked --paths
          ':(glob)**/*three_d*' ':(glob)**/*three-d*'
          ':(glob)**/three_d*/**' ':(glob)**/three-d*/**'
          ':(glob)**/*ThreeD*' ':(glob)**/*threeD*'
          ':(glob)**/ThreeD*/**' ':(glob)**/threeD*/**'
