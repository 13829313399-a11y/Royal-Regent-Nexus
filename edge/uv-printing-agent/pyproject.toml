[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "rr-uv-agent"
version = "1.0.0"
requires-python = ">=3.11"
description = "Outbound read-only UV evidence collector; no native printer control"
dependencies = ["apsw==3.53.4.0", "pywin32==311; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
package = ["pyinstaller>=6.16,<7"]

[project.scripts]
rr-uv-agent = "uv_agent.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
